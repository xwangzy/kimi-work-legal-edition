# Windows 安装包（W4）与 macOS DMG（Apple 芯片）。由 scripts/package-desktop.mjs 调用：先暂存应用目录（.stage/app），再运行本配置。
# 手工构建：node scripts/package-desktop.mjs [--target win32-x64|darwin-arm64] [--sign dev|env|none] [--dir]
appId: com.chinasoft.kimiwork.legal
productName: Kimi Work 法律版
executableName: KimiWorkLegal
copyright: Copyright © 2026 中国软件国际
electronVersion: 44.5.1
directories:
  # 暂存目录：只有运行所需文件，依赖清单只有一个原生模块（package-desktop.mjs 生成）
  app: .stage/app
  output: release
  buildResources: build
files:
  - package.json
  - dist/**
  - electron/**
  # 法规库经 extraResources 放 asar 外：原生 SQLite 走 OS 层打不开 asar 虚拟路径，且 asar 内副本会让内核按 bundleDir 误选
  - "!electron/lawdb/**"
  - node_modules/better-sqlite3-multiple-ciphers/**
asar: true
# 原生模块（N-API 预编译）须在 asar 外才能装载
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**
# 需要随包 Node 运行的组件放在 asar 之外（node.exe 读不了 asar）：Agent 宿主（含宿主内检索 worker）、出站闸门、W 执行域、
# 隔离解析进程与 OCR 模型；主进程启动时按 runtime-manifest.json 逐个核对摘要
extraResources:
  - from: runtime
    to: runtime
    filter: ["**/*"]
  # 签名只读法规库包（lawdb.sqlite + manifest + 内容签名公钥）：须在 asar 外（同上）
  - from: electron/lawdb
    to: lawdb
    filter: ["**/*"]
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
# Electron 安全熔断（复核 B3-A02）：禁止以 Node 方式运行（解析进程已改用随包 Node，W6）、禁止 NODE_OPTIONS 与调试参数注入、
# 只从 asar 加载应用并校验其完整性（release.json 的上游地址与钉住集因此受保护）
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
  # 应用图标（第 49 批）：Kimi 官方 Logomark 多尺寸 ico（16～256，scripts/build-icons.mjs 从 build/brand 下的源 SVG 生成）
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  # 随包 node.exe 保留 OpenJS 基金会的原签名、不重签（其摘要锁定在 asar 内的运行时清单里，重签会改变摘要）
  signExts: ["!node.exe", "!kwl-egress.exe", "!kwl-host.exe", "!kwl-parse.exe"]
  # 签名：由 package-desktop.mjs 按 --sign 注入 CSC_LINK / CSC_KEY_PASSWORD（dev 为自签名测试证书；正式发布用中软 EV/OV 证书）
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
  # 更新包的发布者校验不依赖 app-update.yml（它在 asar 之外、可被本机改写）：主进程 updater.cjs 用随 asar 的 release.json 设置更新地址，
  # 并按发布签名清单（Ed25519）核对下载的安装包
  verifyUpdateCodeSignature: false
nsis:
  # 律师自助安装：按用户安装、无需管理员权限；允许 IT 选择为所有用户安装
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kimi Work 法律版
  # 安装程序、卸载程序与（一键安装形态的）进度条上方图标都用同一个 ico；路径先按 buildResources 找、找不到再按项目目录（apps/desktop）解析
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 更新源与 CDN 上的文件名只用 ASCII（避免空格与中文在 URL 编码上出错）
  artifactName: KimiWorkLegal-Setup-${version}.${ext}
  language: "2052"
  installerLanguages: [zh_CN]
  # 卸载时保留本机案件数据（数据在 %LOCALAPPDATA%\KimiWorkLegal，不漫游；删除须律师在应用内按保留期规则操作）
  deleteAppDataOnUninstall: false
  differentialPackage: true
# macOS（Apple 芯片）DMG：package-desktop.mjs --target darwin-arm64 --sign none 以 ad-hoc 身份（-c.mac.identity=-）签名，只用于本机与内部测试；
# Developer ID 签名与公证尚未接入（docs/部署-云端控制台与桌面端对接.md §7.3b）。自动更新只在 Windows 开启（updater.cjs）
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  # 由 apps/desktop/scripts/build-icons.mjs 从同一 Logomark 源 SVG 生成（按 macOS 图标栅格留边）
  icon: build/icon.icns
  # Electron 44 最低支持 macOS 12
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  # 主程序与各 Helper 同一份权限：V8 JIT；关闭库校验（ad-hoc 签名没有团队标识，否则 Electron 框架与 asar.unpacked 里的原生模块装载不了）
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 不重签（与 Windows 的 signExts 同理）：随包运行时（官方 Node 保留 OpenJS 基金会签名，原生模块保留原签名）与 asar.unpacked 的原生模块，
  # 其摘要已锁定在 asar 内的运行时清单里，codesign 改写 Mach-O 会让主进程判“运行时损坏”；法规库不含可执行代码
  signIgnore:
    - "/Contents/Resources/runtime/"
    - "/Contents/Resources/lawdb/"
    - "/Contents/Resources/app\\.asar\\.unpacked/node_modules/better-sqlite3-multiple-ciphers/"
  # 未接公证：不读 APPLE_ID 等环境变量去提交公证
  notarize: false
dmg:
  # 文件名只用 ASCII（同 nsis.artifactName）
  artifactName: KimiWorkLegal-${version}-${arch}.${ext}
# 自动更新（W7）：通用 HTTPS 源；地址与钉住集以 release.json 为准（主进程 setFeedURL），此处只用于生成 latest.yml 与差分块
publish:
  - provider: generic
    url: https://updates.example.invalid/kimi-work-legal/win
    channel: latest
