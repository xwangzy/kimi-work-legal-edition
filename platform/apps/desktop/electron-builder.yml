# Windows 安装包（W4）。由 scripts/package-desktop.mjs 调用：先暂存应用目录（.stage/app），再运行本配置。
# 手工构建：node scripts/package-desktop.mjs [--sign dev|env|none] [--dir]
appId: com.chinasoft.kimiwork.legal
productName: Kimi Work 法律版
executableName: KimiWorkLegal
copyright: Copyright © 2026 中国软件国际
electronVersion: 44.5.1
directories:
  # 暂存目录：只有运行所需文件，依赖清单只有一个原生模块（package-desktop.mjs 生成）
  app: .stage/app
  output: release
  buildResources: build
files:
  - package.json
  - dist/**
  - electron/**
  # 法规库经 extraResources 放 asar 外：原生 SQLite 走 OS 层打不开 asar 虚拟路径，且 asar 内副本会让内核按 bundleDir 误选
  - "!electron/lawdb/**"
  - node_modules/better-sqlite3-multiple-ciphers/**
asar: true
# 原生模块（N-API 预编译）须在 asar 外才能装载
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**
# 需要随包 Node 运行的组件放在 asar 之外（node.exe 读不了 asar）：Agent 宿主（含宿主内检索 worker）、出站闸门、W 执行域、
# 隔离解析进程与 OCR 模型；主进程启动时按 runtime-manifest.json 逐个核对摘要
extraResources:
  - from: runtime
    to: runtime
    filter: ["**/*"]
  # 签名只读法规库包（lawdb.sqlite + manifest + 内容签名公钥）：须在 asar 外（同上）
  - from: electron/lawdb
    to: lawdb
    filter: ["**/*"]
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
# Electron 安全熔断（复核 B3-A02）：禁止以 Node 方式运行（解析进程已改用随包 Node，W6）、禁止 NODE_OPTIONS 与调试参数注入、
# 只从 asar 加载应用并校验其完整性（release.json 的上游地址与钉住集因此受保护）
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  requestedExecutionLevel: asInvoker
  # 随包 node.exe 保留 OpenJS 基金会的原签名、不重签（其摘要锁定在 asar 内的运行时清单里，重签会改变摘要）
  signExts: ["!node.exe", "!kwl-egress.exe", "!kwl-host.exe", "!kwl-parse.exe"]
  # 签名：由 package-desktop.mjs 按 --sign 注入 CSC_LINK / CSC_KEY_PASSWORD（dev 为自签名测试证书；正式发布用中软 EV/OV 证书）
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
  # 更新包的发布者校验不依赖 app-update.yml（它在 asar 之外、可被本机改写）：主进程 updater.cjs 用随 asar 的 release.json 设置更新地址，
  # 并按发布签名清单（Ed25519）核对下载的安装包
  verifyUpdateCodeSignature: false
nsis:
  # 律师自助安装：按用户安装、无需管理员权限；允许 IT 选择为所有用户安装
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kimi Work 法律版
  # 更新源与 CDN 上的文件名只用 ASCII（避免空格与中文在 URL 编码上出错）
  artifactName: KimiWorkLegal-Setup-${version}.${ext}
  language: "2052"
  installerLanguages: [zh_CN]
  # 卸载时保留本机案件数据（数据在 %LOCALAPPDATA%\KimiWorkLegal，不漫游；删除须律师在应用内按保留期规则操作）
  deleteAppDataOnUninstall: false
  differentialPackage: true
# 自动更新（W7）：通用 HTTPS 源；地址与钉住集以 release.json 为准（主进程 setFeedURL），此处只用于生成 latest.yml 与差分块
publish:
  - provider: generic
    url: https://updates.example.invalid/kimi-work-legal/win
    channel: latest
