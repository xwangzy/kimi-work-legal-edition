<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 兜底 CSP：scripts/build-console.mjs --control-plane <来源> 把 connect-src 收紧为 'self' + 控制面来源；正式部署另由 Web 服务器下发同口径的头 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>控制台 · Kimi Work 法律版</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='180' height='180' rx='45' fill='black'/%3E%3Cpath d='M139.13 36.5137C144.237 36.5137 148.377 40.6535 148.377 45.7602C148.377 50.867 144.237 55.0068 139.13 55.0068L130.972 55.0068C130.371 55.0068 129.884 54.5198 129.884 53.919L129.884 45.7602C129.884 40.6535 134.024 36.5137 139.13 36.5137Z' fill='%231783FF'/%3E%3Cpath d='M87.2905 90.3594L122.186 55.739C122.842 55.0865 122.473 53.7744 121.625 53.7744H102.848C102.644 53.7744 102.447 53.8577 102.288 54.0174L64.6898 91.3104C64.1035 91.8866 63.2366 91.3729 63.2366 90.4496V54.8782C63.2366 54.2673 62.8351 53.7744 62.3443 53.7744H49.406C48.9152 53.7744 48.5137 54.2673 48.5137 54.8782V131.575C48.5137 132.186 48.9152 132.679 49.406 132.679H62.3443C62.8351 132.679 63.2366 132.186 63.2366 131.575V115.948C63.2366 115.615 63.3577 115.295 63.5681 115.087L75.2254 103.522C75.5058 103.244 75.8946 103.202 76.2069 103.411L107.386 126.354C112.492 129.791 118.196 131.901 123.99 132.526C124.506 132.581 124.952 132.068 124.952 131.422V116.705C124.952 116.142 124.614 115.684 124.162 115.615C120.752 115.08 117.425 113.761 114.417 111.734L87.4244 92.1921C86.8635 91.8172 86.7934 90.8523 87.2905 90.3594Z' fill='white'/%3E%3C/svg%3E" />
    <!-- 令牌与桌面端同一份（scripts/build-console.mjs 从 packages/design-tokens 拷入 dist/） -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="console.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- 启动中 -->
    <div class="boot" id="boot" role="status">正在读取配置…</div>

    <!-- 登录页：律师、律所管理员、中软平台人员同一入口（auth.js 渲染卡片内容） -->
    <main class="auth" id="auth" hidden>
      <div class="auth-card" id="auth-card"></div>
    </main>

    <!-- 主界面：暖灰侧栏 + 悬浮在 6px 间距里的白色圆角主区 -->
    <div class="app" id="app" hidden>
      <aside class="sidebar" id="sidebar" aria-label="导航">
        <!-- 品牌（第 51 批）：与律师端同一组合——官方 Logomark + 两行签名（Kimi Work / 版本名），部署环境另起一行 -->
        <div class="brand" aria-label="Kimi Work 法律版 云端控制台">
          <svg class="logo-mark brand-mark" viewBox="0 0 180 180" aria-hidden="true" focusable="false"><rect class="logo-mark-bg" width="180" height="180" rx="45"/><path class="logo-mark-dot" d="M139.13 36.5137C144.237 36.5137 148.377 40.6535 148.377 45.7602C148.377 50.867 144.237 55.0068 139.13 55.0068L130.972 55.0068C130.371 55.0068 129.884 54.5198 129.884 53.919L129.884 45.7602C129.884 40.6535 134.024 36.5137 139.13 36.5137Z"/><path class="logo-mark-k" d="M87.2905 90.3594L122.186 55.739C122.842 55.0865 122.473 53.7744 121.625 53.7744H102.848C102.644 53.7744 102.447 53.8577 102.288 54.0174L64.6898 91.3104C64.1035 91.8866 63.2366 91.3729 63.2366 90.4496V54.8782C63.2366 54.2673 62.8351 53.7744 62.3443 53.7744H49.406C48.9152 53.7744 48.5137 54.2673 48.5137 54.8782V131.575C48.5137 132.186 48.9152 132.679 49.406 132.679H62.3443C62.8351 132.679 63.2366 132.186 63.2366 131.575V115.948C63.2366 115.615 63.3577 115.295 63.5681 115.087L75.2254 103.522C75.5058 103.244 75.8946 103.202 76.2069 103.411L107.386 126.354C112.492 129.791 118.196 131.901 123.99 132.526C124.506 132.581 124.952 132.068 124.952 131.422V116.705C124.952 116.142 124.614 115.684 124.162 115.615C120.752 115.08 117.425 113.761 114.417 111.734L87.4244 92.1921C86.8635 91.8172 86.7934 90.8523 87.2905 90.3594Z"/></svg>
          <div class="brand-text">
            <b>Kimi Work</b>
            <span class="brand-edition">法律版 · 云端控制台</span>
          </div>
        </div>
        <small class="brand-env" id="env"></small>
        <template id="tpl-logomark"><svg class="logo-mark brand-mark" viewBox="0 0 180 180" aria-hidden="true" focusable="false"><rect class="logo-mark-bg" width="180" height="180" rx="45"/><path class="logo-mark-dot" d="M139.13 36.5137C144.237 36.5137 148.377 40.6535 148.377 45.7602C148.377 50.867 144.237 55.0068 139.13 55.0068L130.972 55.0068C130.371 55.0068 129.884 54.5198 129.884 53.919L129.884 45.7602C129.884 40.6535 134.024 36.5137 139.13 36.5137Z"/><path class="logo-mark-k" d="M87.2905 90.3594L122.186 55.739C122.842 55.0865 122.473 53.7744 121.625 53.7744H102.848C102.644 53.7744 102.447 53.8577 102.288 54.0174L64.6898 91.3104C64.1035 91.8866 63.2366 91.3729 63.2366 90.4496V54.8782C63.2366 54.2673 62.8351 53.7744 62.3443 53.7744H49.406C48.9152 53.7744 48.5137 54.2673 48.5137 54.8782V131.575C48.5137 132.186 48.9152 132.679 49.406 132.679H62.3443C62.8351 132.679 63.2366 132.186 63.2366 131.575V115.948C63.2366 115.615 63.3577 115.295 63.5681 115.087L75.2254 103.522C75.5058 103.244 75.8946 103.202 76.2069 103.411L107.386 126.354C112.492 129.791 118.196 131.901 123.99 132.526C124.506 132.581 124.952 132.068 124.952 131.422V116.705C124.952 116.142 124.614 115.684 124.162 115.615C120.752 115.08 117.425 113.761 114.417 111.734L87.4244 92.1921C86.8635 91.8172 86.7934 90.8523 87.2905 90.3594Z"/></svg></template>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <button type="button" class="scrim" id="scrim" aria-label="关闭导航"></button>
      <div class="main">
        <header class="topbar">
          <button type="button" class="icon-btn menu-btn" id="btn-menu" aria-label="打开导航"></button>
          <div class="crumbs" id="crumbs"></div>
          <div class="gsearch" id="gsearch" hidden></div>
          <div class="topbar-right">
            <span class="refreshed" id="refreshed" aria-live="polite"></span>
            <button type="button" class="icon-btn" id="btn-refresh" title="刷新本页（R）" aria-label="刷新本页"></button>
          </div>
        </header>
        <div id="banner-slot"></div>
        <main class="content" id="content" tabindex="-1"></main>
      </div>
    </div>

    <dialog class="drawer" id="drawer" aria-label="详情"></dialog>
    <dialog class="modal" id="modal" aria-label="确认"></dialog>
    <dialog class="modal" id="reauth" aria-label="复核身份"></dialog>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </body>
</html>
