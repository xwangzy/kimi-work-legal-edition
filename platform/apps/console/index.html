<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 兜底 CSP：scripts/build-console.mjs --control-plane <来源> 把 connect-src 收紧为 'self' + 控制面来源；正式部署另由 Web 服务器下发同口径的头 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>控制台 · Kimi Work 法律版</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191919'/%3E%3Cpath d='M7 21h18' stroke='%23167ffb' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M7 15h11' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!-- 令牌与桌面端同一份（scripts/build-console.mjs 从 packages/design-tokens 拷入 dist/） -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="console.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- 启动中 -->
    <div class="boot" id="boot" role="status">正在读取配置…</div>

    <!-- 登录页：律师、律所管理员、中软平台人员同一入口（auth.js 渲染卡片内容） -->
    <main class="auth" id="auth" hidden>
      <div class="auth-card" id="auth-card"></div>
    </main>

    <!-- 主界面：暖灰侧栏 + 悬浮在 6px 间距里的白色圆角主区 -->
    <div class="app" id="app" hidden>
      <aside class="sidebar" id="sidebar" aria-label="导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">K</span>
          <div class="brand-text">
            <b>Kimi Work 法律版</b>
            <small id="env"></small>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <button type="button" class="scrim" id="scrim" aria-label="关闭导航"></button>
      <div class="main">
        <header class="topbar">
          <button type="button" class="icon-btn menu-btn" id="btn-menu" aria-label="打开导航"></button>
          <div class="crumbs" id="crumbs"></div>
          <div class="gsearch" id="gsearch" hidden></div>
          <div class="topbar-right">
            <span class="refreshed" id="refreshed" aria-live="polite"></span>
            <button type="button" class="icon-btn" id="btn-refresh" title="刷新本页（R）" aria-label="刷新本页"></button>
          </div>
        </header>
        <div id="banner-slot"></div>
        <main class="content" id="content" tabindex="-1"></main>
      </div>
    </div>

    <dialog class="drawer" id="drawer" aria-label="详情"></dialog>
    <dialog class="modal" id="modal" aria-label="确认"></dialog>
    <dialog class="modal" id="reauth" aria-label="复核身份"></dialog>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </body>
</html>
