# 控制台的安全响应头（nginx 的 add_header 不会从 server 继承到带 add_header 的 location，所以每个 location 都 include 这一份）。
# 安装到 /etc/nginx/snippets/kwl-console-headers.conf；connect-src 只写控制面来源（与 config.json 的 control_plane_base 一致）。
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cp.kwl.example.com:8443; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
