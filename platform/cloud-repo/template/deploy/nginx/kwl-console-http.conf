# 控制台站点的“只有 80 端口”版本：证书还没签下来时由 deploy/scripts/nginx-site.sh 装这一份（install.sh / upgrade.sh 自动选）。
# 作用：首次签证书时 HTTP-01 验证走 nginx 的 webroot（/var/www/letsencrypt），nginx -t 不因缺证书文件而失败；证书到位后重跑 install.sh 换成完整站点。
# server_name 由脚本替换成控制台域名或公网 IP。
server {
    listen 80;
    listen [::]:80;
    server_name console.kwl.example.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
