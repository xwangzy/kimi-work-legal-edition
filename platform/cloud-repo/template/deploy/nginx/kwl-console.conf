# 统一云端控制台（静态页）。nginx 只托管这个静态页；控制面、网关等服务自己终止 TLS，不经 nginx（客户端钉住服务证书公钥）。
# 安装（deploy/scripts/install.sh 会做）：
#   sudo install -m 0644 deploy/nginx/kwl-console-headers.conf /etc/nginx/snippets/kwl-console-headers.conf
#   sudo install -m 0644 deploy/nginx/kwl-console.conf /etc/nginx/sites-available/kwl-console.conf
#   sudo ln -sf /etc/nginx/sites-available/kwl-console.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# 改两处：server_name（控制台域名），以及 snippets 里 CSP 的 connect-src（控制面地址）。
server {
    listen 80;
    listen [::]:80;
    server_name console.kwl.example.com;
    # certbot 的 HTTP-01 验证走这里；其余一律跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24（Ubuntu 24.04 自带）用“listen … ssl http2”；1.25.1 起也可改写成单独一行“http2 on;”
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.kwl.example.com;

    ssl_certificate     /etc/kwl/tls/console.crt;
    ssl_certificate_key /etc/kwl/tls/console.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kwlconsole:10m;

    root /var/www/kwl-console;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/kwl-console.access.log;
    error_log  /var/log/nginx/kwl-console.error.log;

    # 页面与运行配置不缓存（升级后立刻生效）；模块与样式短缓存
    location = /index.html  { include /etc/nginx/snippets/kwl-console-headers.conf; add_header Cache-Control "no-store" always; }
    location = /config.json { include /etc/nginx/snippets/kwl-console-headers.conf; add_header Cache-Control "no-store" always; }
    location ~* \.(js|css|svg)$ { include /etc/nginx/snippets/kwl-console-headers.conf; add_header Cache-Control "public, max-age=300" always; }
    location / { include /etc/nginx/snippets/kwl-console-headers.conf; try_files $uri $uri/ /index.html; }
}
