/* Local material previews. Original file bytes and object URLs never enter persistence. */
(function(){
  const LIMITS={files:20,textBytes:2*1024*1024,imageBytes:12*1024*1024,documentBytes:50*1024*1024,previewBytes:128*1024,previewChars:80000,excerptChars:8000};
  const ROLES=['我方','对方','参考'];
  const memory=new Map();
  let dialogProject=null,selected=null,returnFocus=null,busy=false,previousOverflow='';
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ext=name=>String(name).split('.').pop().toLowerCase();
  const kind=name=>['txt','md','csv','json'].includes(ext(name))?'text':['png','jpg','jpeg','webp'].includes(ext(name))?'image':['pdf','docx'].includes(ext(name))?'document':'unsupported';
  function validateFile(file,count){const k=kind(file.name);if(count>=LIMITS.files)return '每个项目最多保留 20 份材料';if(k==='unsupported')return '支持 TXT、MD、CSV、JSON、PNG、JPEG、WebP、PDF、DOCX';const max=k==='text'?LIMITS.textBytes:k==='image'?LIMITS.imageBytes:LIMITS.documentBytes;if(file.size>max)return `${k==='text'?'文本':k==='image'?'图片':'文档'}不得超过 ${max/1024/1024} MB`;return '';}
  const bytes=n=>n<1024?`${n} B`:n<1024*1024?`${(n/1024).toFixed(1)} KB`:`${(n/1024/1024).toFixed(1)} MB`;
  function projectKey(project){if(typeof project==='string'&&projects.some(p=>p.id===project))return project;const index=Number.isInteger(Number(project))?Number(project):state.project;return String(projects[index]?.id||'project-'+index);}
  function projectName(key){return projects.find(p=>String(p.id)===key)?.name||'当前项目';}
  function all(){if(!Array.isArray(v2.materials))v2.materials=[];return v2.materials;}
  function list(project=state.project){const key=projectKey(project);return all().filter(m=>m.projectKey===key);}
  function snapshotMaterial(m){return {id:String(m.id),projectKey:String(m.projectKey),name:String(m.name).slice(0,1024),size:Number(m.size)||0,mime:String(m.mime||'').slice(0,100),kind:kind(m.name),lastModified:Number(m.lastModified)||0,role:ROLES.includes(m.role)?m.role:'参考',excerpt:String(m.excerpt||'').slice(0,LIMITS.excerptChars),locator:String(m.locator||'').slice(0,160),addedAt:String(m.addedAt||''),contentStored:false};}
  function taskSnapshot(project=state.project){return list(project).map(snapshotMaterial);}
  function syncAttachments(project=state.project){state.attachments=list(project).map(m=>m.name);return [...state.attachments];}
  function save(){syncAttachments();persistWorkspace();}
  function status(m){if(m.kind==='document')return '仅文件信息 · 待解析';if(memory.has(m.id))return m.kind==='image'?'图片可预览 · 未识别':'文本可预览 · 未分析';return '预览未保留 · 请重新选择文件';}
  function button(label,action,id='',cls=''){return `<button type="button" class="btn ${cls}" data-material-action="${action}" data-material-id="${esc(id)}">${label}</button>`;}
  function panel(scenario){const key=projectKey(state.project),items=list(key);return `<section class="material-panel" data-material-panel data-material-project="${esc(key)}"><div class="material-panel-heading"><div><h4>本次项目材料 <span>${items.length}</span></h4><p>${esc(projectName(key))} · 原文件仅在本浏览器处理</p></div>${button('添加与管理','open','','sm')}</div>${items.length?`<div class="material-panel-list">${items.map(m=>`<button type="button" data-material-action="preview" data-material-id="${esc(m.id)}"><span class="material-kind">${m.kind==='image'?'图':m.kind==='text'?'文':'档'}</span><span><b>${esc(m.name)}</b><small>${esc(m.role)} · ${esc(status(m))}${m.excerpt?' · 有人工摘录':''}</small></span><span>›</span></button>`).join('')}</div>`:'<div class="material-empty">尚未添加材料。可先建立底稿，并列出待补资料。</div>'}<p class="material-footnote">文本可本地预览，图片可查看；PDF / DOCX 待解析。只有文件信息、用途和人工摘录会保存，未进行 OCR 或法律分析。</p></section>`;}
  function refreshPanels(){document.querySelectorAll('[data-material-panel]').forEach(el=>{const wrapper=document.createElement('div');wrapper.innerHTML=panel();el.replaceWith(wrapper.firstElementChild);});}
  function renderDialog(){const root=document.getElementById('legal-material-dialog');if(!root)return;const items=list(dialogProject),m=items.find(x=>x.id===selected)||items[0];selected=m?.id||null;const transient=m&&memory.get(m.id);root.innerHTML=`<div class="material-dialog" role="dialog" aria-modal="true" aria-labelledby="material-dialog-title"><header><div><span>项目材料</span><h2 id="material-dialog-title">${esc(projectName(dialogProject))}</h2></div>${button('关闭','close','','quiet')}</header><div class="material-dialog-note">文件不外传。文本与图片预览只在本次页面内保留；人工摘录和定位会保存到当前浏览器。</div><div class="material-dialog-toolbar"><span>${items.length} / ${LIMITS.files} 份材料</span>${button(busy?'正在读取…':'选择本地文件','pick','','primary')}</div><div class="material-import-feedback" aria-live="polite"></div><div class="material-dialog-grid"><nav aria-label="项目材料列表">${items.map(x=>`<button class="material-file ${x.id===m?.id?'active':''}" type="button" data-material-action="select" data-material-id="${esc(x.id)}"><b>${esc(x.name)}</b><small>${esc(x.role)} · ${bytes(x.size)}</small></button>`).join('')||'<p class="material-empty">添加合同、截图或文本资料后，在右侧预览与标注。</p>'}</nav><div class="material-detail">${m?`<div class="material-detail-title"><div><h3>${esc(m.name)}</h3><p>${esc(status(m))} · ${bytes(m.size)}</p></div>${button('移除','remove',m.id,'quiet sm')}</div><div class="material-preview">${m.kind==='text'?(transient?`<pre>${esc(transient.text)}</pre>${transient.truncated?'<div class="material-preview-hint">仅显示前 128 KB / 80,000 字符，完整文件未保存。</div>':''}`:`<div class="material-empty">文本预览未持久保存。请重新选择同名、同大小及修改时间的文件恢复预览。</div>`):m.kind==='image'?(transient?`<img src="${esc(transient.url)}" alt="${esc(m.name)}"><div class="material-preview-hint">仅显示原图，未做文字识别；请人工填写必要摘录。</div>`:'<div class="material-empty">图片仅驻留页面内存。刷新后请重新选择原图，人工摘录仍保留。</div>'):'<div class="material-empty">已记录文件信息。此演示不解析 PDF / DOCX，可在下方人工记录摘录及页码。</div>'}</div><div class="material-annotations"><label>材料用途<select data-material-field="role" data-material-id="${esc(m.id)}">${ROLES.map(r=>`<option ${r===m.role?'selected':''}>${r}</option>`).join('')}</select></label><label>页码或位置<input data-material-field="locator" data-material-id="${esc(m.id)}" value="${esc(m.locator)}" maxlength="160" placeholder="例如：第 3 页第 2 条／截图右下角"></label><label class="full">人工摘录 <span>自动保存 · 最多 8,000 字符</span><textarea data-material-field="excerpt" data-material-id="${esc(m.id)}" maxlength="8000" rows="5" placeholder="记录与本次事项相关的原文；区分原文与个人备注。">${esc(m.excerpt)}</textarea></label></div>`:'<div class="material-empty material-large-empty">先添加一份材料，再为它标记用途、摘录与来源位置。</div>'}</div></div><footer>文本 ≤ 2 MB · 图片 ≤ 12 MB · PDF / DOCX ≤ 50 MB · 每项目最多 20 份</footer></div>`;const pick=root.querySelector('[data-material-action="pick"]');if(pick)pick.disabled=busy;}
  function open(id){if(!document.getElementById('legal-material-dialog')){returnFocus=document.activeElement;previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';const root=document.createElement('div');root.id='legal-material-dialog';root.className='material-overlay';document.body.appendChild(root);}dialogProject=projectKey(state.project);selected=typeof id==='string'?id:null;renderDialog();document.querySelector('#legal-material-dialog [data-material-action="close"]')?.focus();}
  function close(){document.getElementById('legal-material-dialog')?.remove();document.body.style.overflow=previousOverflow;refreshPanels();if(typeof render==='function')render();if(returnFocus?.isConnected)returnFocus.focus();dialogProject=null;}
  async function importFiles(files,key){const messages=[];busy=true;renderDialog();for(const file of Array.from(files).slice(0,50)){const existing=list(key).find(m=>m.name===file.name&&((m.size===file.size&&m.lastModified===file.lastModified)||(!m.size&&!m.lastModified)));const error=validateFile(file,existing?0:list(key).length);if(error){messages.push(`${file.name}：${error}`);continue;}let preview;try{if(kind(file.name)==='text'){const text=await file.slice(0,LIMITS.previewBytes).text();preview={text:text.slice(0,LIMITS.previewChars),truncated:file.size>LIMITS.previewBytes||text.length>LIMITS.previewChars};}else if(kind(file.name)==='image')preview={url:URL.createObjectURL(file)};}catch(e){messages.push(`${file.name}：无法读取，请重新选择`);continue;}const m=existing||snapshotMaterial({id:'material-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),projectKey:key,name:file.name,size:file.size,mime:file.type,lastModified:file.lastModified,role:'参考',addedAt:new Date().toISOString()});if(existing)Object.assign(m,{size:file.size,mime:file.type,lastModified:file.lastModified,kind:kind(file.name)});else all().push(m);const old=memory.get(m.id);if(old?.url)URL.revokeObjectURL(old.url);if(preview)memory.set(m.id,preview);selected=m.id;}if(files.length>50)messages.push('单次最多处理 50 个选择项');busy=false;save();renderDialog();refreshPanels();const feedback=document.querySelector('.material-import-feedback');if(feedback)feedback.textContent=messages.join('；')||'材料已添加，原始内容未写入本地存储。';return messages;}
  function remove(id,project=state.project){const key=projectKey(project),item=all().find(m=>m.id===id&&m.projectKey===key);if(!item)return false;const cached=memory.get(id);if(cached?.url)URL.revokeObjectURL(cached.url);memory.delete(id);v2.materials=all().filter(m=>m!==item);save();renderDialog();refreshPanels();return true;}
  function clear(project=state.project){list(project).map(m=>m.id).forEach(id=>remove(id,project));}
  function pick(){if(busy)return;const key=dialogProject||projectKey(state.project),input=document.createElement('input');input.type='file';input.multiple=true;input.accept='.txt,.md,.csv,.json,.png,.jpg,.jpeg,.webp,.pdf,.docx';input.addEventListener('change',()=>importFiles(input.files,key));input.click();}
  document.addEventListener('click',e=>{const trigger=e.target.closest?.('[data-material-action]');if(!trigger)return;e.preventDefault();const a=trigger.dataset.materialAction,id=trigger.dataset.materialId;if(a==='open'||a==='preview')open(id);if(a==='close')close();if(a==='pick')pick();if(a==='select'){selected=id;renderDialog();}if(a==='remove'){remove(id,dialogProject);}});
  document.addEventListener('error',e=>{const img=e.target;if(img.tagName==='IMG'&&img.closest?.('#legal-material-dialog')){const holder=img.parentElement;const note=document.createElement('div');note.className='material-empty';note.textContent='无法解码这张图片。请检查原文件格式，或重新选择有效图片；人工摘录仍可填写。';img.replaceWith(note);}},true);
  function annotate(e){const field=e.target.dataset?.materialField;if(!['role','locator','excerpt'].includes(field))return;const m=all().find(x=>x.id===e.target.dataset.materialId&&x.projectKey===dialogProject);if(!m)return;m[field]=field==='role'?(ROLES.includes(e.target.value)?e.target.value:'参考'):e.target.value.slice(0,field==='excerpt'?LIMITS.excerptChars:160);save();refreshPanels();if(field==='role'){document.querySelectorAll('#legal-material-dialog .material-file').forEach(el=>{if(el.dataset.materialId===m.id){const label=el.querySelector('small');if(label)label.textContent=m.role+' · '+bytes(m.size);}});}}
  document.addEventListener('input',annotate);document.addEventListener('change',annotate);
  document.addEventListener('keydown',e=>{const root=document.getElementById('legal-material-dialog');if(!root)return;e.stopImmediatePropagation();if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close();}if(e.key==='Tab'){const focusable=Array.from(root.querySelectorAll('button:not([disabled]),input,select,textarea')).filter(el=>el.offsetParent!==null);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}},true);
  window.addEventListener('pagehide',()=>{memory.forEach(m=>{if(m.url)URL.revokeObjectURL(m.url);});memory.clear();});
  window.addEventListener('pageshow',e=>{if(e.persisted){renderDialog();refreshPanels();}});
  // Preserve legacy file-name-only attachments once, under their existing project.
  if(!Array.isArray(v2.materials)){v2.materials=(Array.isArray(state.attachments)?state.attachments:[]).slice(0,LIMITS.files).map((name,i)=>snapshotMaterial({id:'material-legacy-'+i,projectKey:projectKey(state.project),name:String(name),role:'参考'}));}
  const baseRender=render;
  render=function(){syncAttachments();return baseRender();};
  window.LegalMaterials={open,panel,taskSnapshot,syncAttachments,remove,clear,limits:{...LIMITS},helpers:{escapeHTML:esc,kind,validateFile,snapshotMaterial,projectKey},importFiles};
})();

</script>
