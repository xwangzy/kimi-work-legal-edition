/* Capability library polish: clearer reading order, compact chrome, readable copy. */
.skills-v2 {
  --cap-ink: #262c35;
  --cap-copy: #5d6775;
  --cap-muted: #747d89;
  --cap-line: #e3e7ed;
}
.skills-v2 .page-head { margin-bottom: 22px; }
.skills-v2 .page-head h1 { color: var(--cap-ink); font-weight: 600; }
.skills-v2 .page-head p { color: var(--cap-copy); font-size: 13px; }
.skills-v2 .skill-hub-intro {
  padding: 16px 20px;
  gap: 20px;
  border-color: var(--cap-line);
  background: #f7f9fc;
  border-radius: 10px;
}
.skills-v2 .skill-hub-intro > div:first-child { padding-left: 45px; }
.skills-v2 .skill-intro-icon { top: 4px; width: 32px; height: 32px; border-radius: 8px; }
.skills-v2 .skill-intro-icon .ico { width: 18px; height: 18px; }
.skills-v2 .skill-hub-intro h2 { font-size: 15px; margin-bottom: 3px; }
.skills-v2 .skill-hub-intro p { font-size: 12px; color: var(--cap-copy); line-height: 1.7; }
.skills-v2 .skill-hub-count { padding-left: 20px; gap: 8px; }
.skills-v2 .skill-hub-count strong { font-size: 25px; color: #34445b; }
.skills-v2 .skill-hub-count span { color: var(--cap-copy); font-size: 12px; }
.skills-v2 .skill-nav { margin-top: 18px; gap: 28px; }
.skills-v2 .skill-nav > button { padding: 13px 0; color: var(--cap-copy); }
.skills-v2 .skill-nav > button.is-active { color: var(--cap-ink); }
.skills-v2 .skill-nav span { color: #626d7d; background: #edf0f5; }
.skills-v2 .skill-filter-row { padding: 20px 0; gap: 16px; }
.skills-v2 .skill-category-filter { gap: 4px; }
.skills-v2 .skill-category-filter button { padding: 7px 11px; font-size: 13px; color: var(--cap-copy); }
.skills-v2 .skill-category-filter button.is-active { background: #edf2fa; color: #355d97; }
.skills-v2 .skill-search { min-height: 36px; border-color: #dbe1e9; background: #fff; }
.skills-v2 .skill-search input { font-size: 13px; color: var(--cap-ink); }
.skills-v2 .skill-search input::placeholder { color: var(--cap-muted); }
.skills-v2 .skill-tiles { gap: 16px; align-items: stretch; }
.skills-v2 .skill-tile {
  display: flex;
  flex-direction: column;
  padding: 20px 20px 0;
  border: 1px solid var(--cap-line);
  border-radius: 12px;
  box-shadow: 0 2px 5px #23324b03;
}
.skills-v2 .skill-tile:hover { border-color: #b6c7df; box-shadow: 0 5px 18px #24395209; }
.skills-v2 .skill-tile-top { margin-bottom: 14px; gap: 10px; }
.skills-v2 .skill-symbol { width: 35px; height: 35px; border-radius: 9px; background: #f0f3f8; color: #526d98; }
.skills-v2 .skill-state { color: #747d89; font-size: 11px; }
.skills-v2 .skill-state.is-enabled { color: #527361; }
.skills-v2 .skill-state.is-enabled:before { background: #608c73; }
.skills-v2 .skill-tile-category { margin-bottom: 5px; font-size: 11px; color: var(--cap-muted); line-height: 1.7; }
.skills-v2 .skill-tile h3, .skills-v2 .skill-role h3 { font-size: 16px; line-height: 1.55; color: var(--cap-ink); font-weight: 600; }
.skills-v2 .skill-tile > p { margin-top: 8px; font-size: 13px; line-height: 1.8; color: var(--cap-copy); min-height: 46px; }
.skills-v2 .skill-tools { margin: 16px 0; gap: 7px 10px; font-size: 11px; color: #677486; }
.skills-v2 .skill-tools > span { padding: 2px 0; }
.skills-v2 .skill-tile footer { margin-top: auto; min-height: 51px; padding: 10px 0; border-color: #edf0f4; }
.skills-v2 .skill-tile footer > span { color: var(--cap-muted); font-size: 11px; }
.skills-v2 .skill-tile footer .btn { min-height: 31px; color: #365982; font-size: 12px; font-weight: 500; padding: 4px 0 4px 8px; }
.skills-v2 .skill-local-note { margin-top: 22px; color: var(--cap-muted); font-size: 12px; line-height: 1.8; }
.skills-v2 .skill-section-note { font-size: 13px; color: var(--cap-copy); line-height: 1.8; }
.skills-v2 .skill-roles { gap: 16px; }
.skills-v2 .skill-role { display: flex; flex-direction: column; padding: 22px; }
.skills-v2 .skill-role > .skill-symbol { margin-bottom: 16px; }
.skills-v2 .skill-role p { font-size: 13px; color: var(--cap-copy); line-height: 1.8; }
.skills-v2 .skill-role .btn { align-self: flex-start; margin-top: auto; }
.skills-v2 .skill-empty p { color: var(--cap-copy); }
.skill-config-description { color: #606c7d !important; font-size: 14px !important; margin: 18px 0 20px !important; }
.skill-config-heading p { color: #737e8e !important; font-size: 12px !important; }
.skill-config-heading h3 { font-weight: 600; }
.skill-config-tabs { gap: 15px; }
.skill-config-tabs button { min-height: 42px; color: #657286; font-size: 13px; }
.skill-config-section { min-height: 260px; padding-top: 22px; }
.skill-config-section h4 { font-size: 14px; color: #34465e; }
.skill-config-section > p { color: #5f6d80 !important; font-size: 14px !important; }
.skill-config-summary { grid-template-columns: 76px minmax(0, 1fr); font-size: 13px; gap: 16px; line-height: 1.8; }
.skill-config-summary span { color: #758091; }
.skill-config-summary b { color: #46576d; }
.skill-config-tip { padding: 14px 16px; color: #627186; font-size: 13px; line-height: 1.85; }
.skill-config-rule { background: #f7f9fc; color: #465971; line-height: 1.95; padding: 18px; }
.skill-config-muted { color: #737f90 !important; font-size: 12px !important; }
.skill-config-tool b { font-size: 14px; color: #465970; }
.skill-config-tool small { font-size: 12px; color: #737f90; line-height: 1.7; }
.skill-config-tool .skill-config-muted { flex-shrink: 0; }
.skill-config-actions { padding-top: 18px; gap: 8px; flex-wrap: wrap; }
.skill-config-form > label, .skill-config-columns > label { font-size: 13px; color: #55667c; }
.skill-config-form input, .skill-config-form textarea, .skill-config-form select { font-size: 14px; }
.skill-config-form textarea { min-height: 150px; }
.skill-config-tool-options label { font-size: 13px; }
.skill-config-sample p, .skill-config-sample ol { color: #5d6d81; font-size: 14px; }
.skill-config-picker .selection-row p { color: #748093; font-size: 12px; }

@media (max-width: 1250px) {
  .skills-v2 .skill-filter-row { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .skills-v2 .skill-search { width: 240px; max-width: 100%; }
}
@media (max-width: 900px) {
  .skills-v2 .skill-hub-intro { padding: 15px 18px; }
  .skills-v2 .skill-roles { grid-template-columns: 1fr; }
}
@media (max-width: 650px) {
  .skills-v2 .page-head { gap: 16px; margin-bottom: 20px; }
  .skills-v2 .page-head h1 { font-size: 25px; }
  .skills-v2 .page-head p { font-size: 13px; }
  .skills-v2 .skill-hub-intro { padding: 14px 16px; }
  .skills-v2 .skill-hub-intro > div:first-child { padding-left: 0; }
  .skills-v2 .skill-hub-intro h2 { font-size: 14px; }
  .skills-v2 .skill-hub-intro p { font-size: 12px; }
  .skills-v2 .skill-nav { gap: 24px; overflow-x: auto; scrollbar-width: thin; }
  .skills-v2 .skill-nav > button { font-size: 13px; flex-shrink: 0; }
  .skills-v2 .skill-filter-row { padding: 16px 0; gap: 12px; }
  .skills-v2 .skill-category-filter { gap: 4px; }
  .skills-v2 .skill-category-filter button { font-size: 12px; padding: 6px 9px; }
  .skills-v2 .skill-search { width: 100%; min-height: 39px; }
  .skills-v2 .skill-tiles { grid-template-columns: 1fr; gap: 12px; }
  .skills-v2 .skill-tile { padding: 18px 18px 0; }
  .skills-v2 .skill-tile-top { margin-bottom: 11px; }
  .skills-v2 .skill-tile > p { min-height: 0; font-size: 13px; }
  .skills-v2 .skill-tools { margin: 13px 0; }
  .skills-v2 .skill-tile footer { min-height: 49px; }
  .skills-v2 .skill-local-note { font-size: 11px; }
  .skill-config-tabs { gap: 10px; overflow-x: auto; }
  .skill-config-tabs button { font-size: 12px; flex-shrink: 0; }
  .skill-config-summary { grid-template-columns: 64px minmax(0, 1fr); gap: 13px; font-size: 13px; }
  .skill-config-detail .skill-config-section { min-height: 220px; }
  .skill-config-rule { padding: 14px; font-size: 13px; }
  .skill-config-tip { padding: 12px 14px; font-size: 12px; }
  .skill-config-tool { gap: 9px; flex-wrap: wrap; }
  .skill-config-tool > div { min-width: 130px; }
  .skill-config-tool .skill-config-muted { font-size: 11px !important; }
  .skill-config-columns { grid-template-columns: 1fr; }
}

/* Business inputs and concrete deliverables stay visible before technical dependencies. */

  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 5px 9px;
  padding: 12px 13px;
  margin-top: 15px;
  background: #f7f9fc;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.75;
}
.skills-v2 .skill-card-io > span { color: #7a8595; padding-top: 1px; }
.skills-v2 .skill-card-io > span[aria-hidden] { display: none; }
.skills-v2 .skill-card-io > p { min-width: 0; margin: 0; color: #596b82; font-size: 12px; line-height: 1.8; }
.skills-v2 .skill-card-io > p:last-child { color: #3f5572; }
.skills-v2 .skill-card-actions { display: flex; align-items: center; gap: 10px; }

.skills-v2 .skill-card-actions .btn.quiet { padding: 5px 0; color: #6b788b; }

      fields: fields(['dispute', '争议与我方立场', '说明案由、代理方与希望实现的结果', '买卖合同纠纷，代理供货方明川设备公司，拟追索未付货款。'], ['facts', '事实与争议节点', '按时间说明交易经过，区分陈述和已核实事实', '客户称2025年交付设备后尚欠80万元；对方以调试不合格拒付，验收状态待核实。'], ['venue', '地域与程序阶段', '填写拟受理法院、仲裁约定和现阶段', '拟在杭州起诉，合同管辖条款及双方住所地待核实。'], ['materials', '现有材料与缺口', '列可读取的材料、关键条款及缺失证据', '购销合同正文、送货记录与往来邮件；缺最终验收单。']),

      instructions: '1. 核验主体、管辖、诉请及证据支撑；无法确认的身份信息保留占位。\n2. 按本金变动和不同起算日分段，明确计息基础、日数规则、年日数换算及四舍五入方式，展示公式和中间结果。\n3. 检查利息、违约金与损失是否重复主张，另列约定效力、调整风险及当地适用规则待核验项。\n4. 生成事实与理由、诉讼请求及附件目录相互一致的起诉状内部草稿，暂计金额与请求至实际清偿之日的表述分别呈现。',

function contractView(){const done=issues.filter(x=>x.status!=='pending').length;return `<div class="content">${pageHead('YS-2026-018 / CONTRACT REVIEW','软件采购合同审查',`${state.role}立场 · ${escapeHTML(state.playbook)} · ${escapeHTML(state.jurisdiction)}`,button(icon('history')+'任务记录','task-log')+button('预览交付包 '+icon('arrow'),'delivery','primary'))}<div class="protocol" style="margin:-8px 0 19px"><span>${icon('folder')}3 份示例材料</span><span>${icon('book')}律所规则与商业建议分开标注</span><span>${icon('check')}已处理 ${done} / 4</span></div><div class="review-layout"><section class="document-side" aria-label="原始合同与修订"><div class="document-toolbar"><span class="flex">${icon('file')}软件开发及服务合同_v1.docx</span><div class="segments"><button data-action="doc-mode" data-id="revision" class="${state.mode==='revision'?'on':''}">修订</button><button data-action="doc-mode" data-id="original" class="${state.mode==='original'?'on':''}">原文</button></div></div><div class="paper-wrap"><article class="paper"><div class="doc-kicker">DEMONSTRATION DOCUMENT</div><h2>软件开发及服务合同</h2><p class="party">甲方：远山科技有限公司（采购方）<br>乙方：瀚川软件有限公司（供应商）</p><p>双方就业务管理系统开发及相关服务，协商订立本合同。以下为本次审查涉及的条款节选。</p>${issues.map((x,i)=>`<div class="doc-clause ${state.selected===i?'selected':''} ${x.status==='accepted'?'reviewed':''}" id="clause-${i}" data-action="select-issue" data-id="${i}"><div class="clause-id">${x.clause} · 原文件第 ${x.page} 页</div>${state.mode==='revision'&&x.status==='accepted'?`<del>${escapeHTML(x.original)}</del><br><ins>${escapeHTML(x.edited||x.suggestion)}</ins>`:escapeHTML(x.original)}</div>`).join('')}<div class="doc-foot">虚构合同 · 仅用于展示交互，不作为可直接使用的合同范本</div></article></div></section><section class="suggestion-side" aria-label="律师审查建议"><div class="review-header"><div class="flex between"><h2>审查建议 <span class="muted">4</span></h2>${pill('2 项重大风险','red')}</div><p>点击建议定位原文；逐条决定如何处理。</p><div class="progress"><span style="width:${done/4*100}%"></span></div><div class="flex between small"><span>已处理 ${done} / 4</span><span>接受 ${issues.filter(x=>x.status==='accepted').length} · 拒绝 ${issues.filter(x=>x.status==='rejected').length}</span></div></div><div class="issue-list">${issues.map((x,i)=>issueView(x,i)).join('')}</div><div class="sticky-review-footer"><span class="review-status">${done===4?'条款处理完毕，请核对交付清单':'重大项需具名律师判断'}</span>${button('下一项','next-issue','sm')}</div></section></div><div class="help-foot">本次为演示回放。修订内容仅影响示例预览，不修改原文件；正式产品的 DOCX 修订应沿用 Kimi 文档能力并验证兼容性。</div></div>`}
function issueView(x,i){return `<div class="issue ${state.selected===i?'active':''}"><button class="issue-top" style="width:100%;text-align:left" data-action="select-issue" data-id="${i}" aria-expanded="${state.selected===i}">${pill(x.status==='pending'?x.level:x.status==='accepted'?'已接受':'已拒绝',x.status==='pending'?(x.level==='重大'?'red':'amber'):'green')}<span>${x.title}</span><span class="chevron">${icon(state.selected===i?'down':'chevron')}</span></button>${state.selected===i?`<div class="issue-content"><div class="flex">${pill(x.kind)}<button class="citation" data-action="source" data-id="${i}">${x.clause} ↗</button></div><div class="label">问题判断</div><p>${x.why}</p><div class="label">建议文本</div><div class="diff">${escapeHTML(x.edited||x.suggestion)}</div><div class="rationale"><b>${x.rule}</b><br>${x.preferred}</div>${x.reason?`<div class="label">拒绝理由</div><p>${escapeHTML(x.reason)}</p>`:''}<div class="issue-actions">${x.status==='pending'?button(icon('check')+'接受','accept','primary sm',`data-id="${i}"`)+button('修改后接受','edit-issue','sm',`data-id="${i}"`)+button('拒绝','reject','quiet sm',`data-id="${i}"`):button('撤销处理','undo','sm',`data-id="${i}"`)}</div></div>`:''}</div>`}
function matrixView(){let rows=matrixFiles.map((f,i)=>({f,i})).filter(x=>state.matrixFilter==='all'||state.matrixFilter==='failed'&&x.i===6&&!state.matrixRetried||state.matrixFilter==='risk'&&[0,3,4].includes(x.i));return `<div class="content">${pageHead('QM-2026-009 / TABULAR REVIEW','采购合同尽调矩阵','同一组问题，横向审查全部合同；答案始终关联材料出处。',button(icon('refresh')+'重跑未锁定项','rerun')+button(icon('download')+'导出矩阵','export-matrix','primary'))}<div class="metric-row"><span><strong>8</strong>份合同</span><i class="sep"></i><span><strong>${state.matrixRetried?8:7}</strong>已提取</span><span><strong>${state.matrixRetried?0:1}</strong>待处理</span><span><strong>${state.matrixVerified.size}</strong>已核验单元格</span><span><strong>${state.matrixLocked.size}</strong>已锁定</span></div><div class="filters"><select id="matrix-filter" aria-label="筛选合同"><option value="all" ${state.matrixFilter==='all'?'selected':''}>全部合同</option><option value="risk" ${state.matrixFilter==='risk'?'selected':''}>存在关注项</option><option value="failed" ${state.matrixFilter==='failed'?'selected':''}>识别失败</option></select>${pill('投资方尽调标准 v1.8','blue')}<span class="small grow">点击任意答案，查看原文与分析依据</span></div><div class="matrix-wrap"><table class="matrix"><thead><tr><th>文件 / 材料</th>${matrixCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(({f,i})=>`<tr><td><div class="matrix-name">${f}</div><div class="matrix-note">${String(i+1).padStart(2,'0')} · 示例文件 ${i===6?'.pdf':'.docx'}</div></td>${i===6&&!state.matrixRetried?`<td colspan="4"><div class="flex">${pill('识别失败','amber')}<span class="small grow">扫描页模糊，金额无法可靠识别</span>${button('重新识别','retry','sm')}</div></td>`:matrixValues[i].map((v,j)=>{let k=i+'-'+j;return `<td><button class="cell" data-action="matrix-cell" data-id="${k}"><span>${state.matrixLocked.has(k)?'⌑ ':''}${j===1&&(i===0||i===3||i===4)?pill(v,'amber'):escapeHTML(v)}</span><span class="source-count">${state.matrixVerified.has(k)?'✓ 律师已核验':'待核验'} · ${j===1&&[0,3].includes(i)?'未发现明确约定':'1 处原文'}${state.matrixLocked.has(k)?' · 已锁定':''}</span></button></td>`}).join('')}</tr>`).join(''):`<tr><td colspan="5"><div class="empty">没有符合条件的合同</div></td></tr>`}</tbody></table></div><div class="help-foot">8 份固定示例用于展示提取、失败重试、逐格核验与锁定。重跑只恢复未锁定项的演示提取值。</div></div>`}
function researchView(){const shown=findings.filter(x=>(state.evidenceFilter==='all'||x.type===state.evidenceFilter)&&(!state.search||(x.title+x.summary).includes(state.search)));return `<div class="content">${pageHead('XL-2026-032 / LEGAL RESEARCH','买卖合同争议 · 法律研究','围绕欠付货款、交付证明与管辖约定，建立可追溯的研究底稿。',button(icon('download')+'导出备忘录','export-research','primary'))}<div class="filters"><div class="search-box">${icon('search')}<input id="research-search" aria-label="筛选研究资料" placeholder="筛选当前研究资料" value="${escapeHTML(state.search)}"></div><select id="research-filter" aria-label="资料类别"><option value="all" ${state.evidenceFilter==='all'?'selected':''}>全部资料</option><option ${state.evidenceFilter==='法源'?'selected':''}>法源</option><option ${state.evidenceFilter==='模板'?'selected':''}>模板</option></select>${pill('中国内地','blue')}${pill('事实期间：2026 年')}</div><div class="research-layout"><div class="panel"><div class="flex between" style="margin-bottom:20px"><h2 style="margin:0">研究资料 <span class="small">${shown.length} 项</span></h2><span class="small">官方参考来源</span></div>${shown.length?shown.map(x=>`<article class="result-card"><div class="flex">${pill(x.type,'blue')}<span class="small">${x.authority}</span></div><h3>${x.title}</h3><p>${x.summary}</p><div class="tags">${button('来源与适用说明','research-source','sm',`data-id="${x.id}"`)}${button(state.researchIds.has(x.id)?'✓ 已纳入备忘录':'+ 纳入备忘录','include-research','quiet sm',`data-id="${x.id}"`)}</div></article>`).join(''):'<div class="empty">没有匹配资料，请调整关键词或筛选条件。</div>'}<div style="margin-top:20px">${notice('案例检索库尚未连接。本演示不生成虚构案号；接入授权数据库后，再展示具体类案原文和比较结果。','neutral')}</div>${button(icon('plug')+'查看法源连接','sources','quiet sm','style="margin-top:12px"')}</div><aside class="stack"><section class="panel"><div class="eyebrow">RESEARCH MEMO</div><h2>检索备忘录</h2><p class="small">检索问题、来源与适用分析一起留存。</p><div class="divider"></div><div class="stack" style="font-size:13px;color:#768398"><div><b style="font-weight:500;color:#4f607b">01 &nbsp;待决问题</b><p style="margin-top:6px">交付事实如何证明？欠付余额如何核对？对方可能提出哪些质量抗辩？</p></div><div><b style="font-weight:500;color:#4f607b">02 &nbsp;纳入来源</b><p style="margin-top:6px">${state.researchIds.size} 项已选官方参考材料 · 尚无授权类案结果</p></div><div><b style="font-weight:500;color:#4f607b">03 &nbsp;待补材料</b><p style="margin-top:6px">送货单规格清晰扫描件、催告送达证明、对方质量异议记录。</p></div></div></section>${notice('法源现行状态、案件发生时点及本案适用性需要分别核对。资料摘要为方法说明，不等同于个案法律结论。','amber')}</aside></div></div>`}
function evidenceView(){return `<div class="content">${pageHead('XL-2026-032 / EVIDENCE WORKSPACE','买卖合同纠纷 · 事实与证据','供货方立场 · 6 份示例材料 · 诉讼准备阶段',button('开展法律研究','research')+button('起草要素式文书 '+icon('arrow'),'pleading','primary'))}<div class="research-layout"><div class="panel"><h2>事实时间线</h2>${evidence.map((e,i)=>`<div class="result-card"><div class="flex between"><span class="mono small">${e.date}</span><span class="flex">${pill(e.status,e.status==='需补充'?'amber':'')}${state.timelineReviewed.has(i)?pill('已核对材料','green'):''}</span></div><h3>${e.title}</h3><p>${e.claim}</p><div class="tags"><button class="citation" data-action="evidence-source" data-id="${i}">${e.file} · ${e.page} ↗</button></div></div>`).join('')}</div><aside class="stack"><div class="panel"><div class="eyebrow">CLAIMS & GAPS</div><h2>主张与材料缺口</h2><div class="cost"><span>合同价款</span><strong>48 万元</strong></div><div class="cost"><span>已收款（示例流水）</span><strong>16 万元</strong></div><div class="cost" style="border-top:1px solid var(--line)"><span>待主张货款</span><strong>32 万元</strong></div><p class="small">对账余额与流水差额一致；利息及费用尚未确定。</p></div>${notice('两项待补充：交付规格信息不清晰；催款函送达证明缺失。当前材料不足以判断质量抗辩及催告效果。','amber')}<div class="panel"><h2>下一步工作</h2><div class="stack">${button('查看证据目录','evidence-list')}${button(icon('download')+'导出事实底稿','export-evidence')}</div></div></aside></div></div>`}
function skillsView(){const filtered=skills.filter(s=>s.join('').includes(state.skillSearch));return `<div class="content">${pageHead('LEGAL SKILLS','把本所经验，变成可执行的工作标准','每个技能都明确适用范围、输入材料、审查规则和交付成果。',button(icon('book')+'管理本所标准','standard'))}<div class="filters"><div class="search-box">${icon('search')}<input id="skill-search" aria-label="搜索法律技能" placeholder="搜索技能或审查标准" value="${escapeHTML(state.skillSearch)}"></div>${pill('6 个法律技能','blue')}${pill('示例标准 · 非真实律所制度')}</div><div class="skill-grid">${filtered.map(([name,ver,desc,id,i])=>`<article class="skill-card"><div class="flex between"><span class="workflow-icon" style="margin:0">${icon(i)}</span>${pill('行业增强','blue')}</div><h3>${name}</h3><p>${desc}</p><footer><span class="small">${ver}</span><button class="link-btn" data-action="skill-detail" data-id="${id}">查看技能 →</button></footer></article>`).join('')||'<div class="empty">没有匹配技能</div>'}</div></div>`}

function deliveryView(){const pending=issues.filter(x=>x.status==='pending').length;const blocked=pending>0||!state.sourceReviewed||!state.customerConfirmed;return `<div class="content">${pageHead('YS-2026-018 / DELIVERABLES','软件采购合同 · 交付中心','把条款处置、材料缺口与人工核验，一起留在工作底稿中。',button('返回审查','contract')+button(icon('download')+'导出演示审查报告','export-final','primary',blocked?'disabled':''))}<div class="delivery-grid"><div class="stack"><section class="panel"><div class="flex between"><h2 style="margin:0">交付清单</h2>${pill(blocked?'内部草稿':'复核完成',blocked?'amber':'green')}</div><div class="file-row"><span class="file-symbol">${icon('file')}</span><div class="grow"><h3>合同修订稿.docx</h3><p>正式产品交付形态 · 本演示提供页面预览</p></div>${button('预览','contract','sm')}</div><div class="file-row"><span class="file-symbol">${icon('file')}</span><div class="grow"><h3>审查意见报告.html</h3><p>本演示可实际下载 · 含全部处置和材料限制</p></div>${button('草稿下载','export-draft','sm')}</div><div class="file-row"><span class="file-symbol">${icon('history')}</span><div class="grow"><h3>本次操作记录.json</h3><p>前端演示记录 · 不等同于机构合规审计系统</p></div>${button('下载','export-audit','sm')}</div></section><section class="panel"><h2>本次操作记录</h2>${auditView()}</section></div><div class="stack"><section class="panel"><h2>交付前检查</h2><div class="check-row"><span class="check-dot ${pending?'wait':''}">${pending?'!':'✓'}</span><div class="grow"><b>律师处置全部审查建议</b><small>${pending?`仍有 ${pending} 项待处理`:'4 项均有律师处理决定'}</small></div>${pending?button('去处理','contract','quiet sm'):''}</div><div class="check-row"><span class="check-dot ${state.sourceReviewed?'':'wait'}">${state.sourceReviewed?'✓':'!'}</span><div class="grow"><b>核对来源与建议对应关系</b><small>${state.sourceReviewed?'已确认示例条款与来源对应':'确认文件版本、条款位置和引文支持范围'}</small></div>${button(state.sourceReviewed?'查看':'核对','verify-delivery','quiet sm')}</div><div class="check-row"><span class="check-dot ${state.customerConfirmed?'':'wait'}">${state.customerConfirmed?'✓':'!'}</span><div class="grow"><b>处理待客户补充事项</b><small>附件一的具体性能指标仍待客户补充。</small>< function design(){modal('设计判断与能力边界',`<div class="eyebrow">CHINASOFT INTERNATIONAL × KIMI</div><h3 style="font-size:23px;margin-top:5px;color:#354863">让律师的工作标准，<br>贯穿每一次 AI 执行。</h3><p style="margin-top:16px">定位是 Kimi Work 的法律行业发行版：继承桌面工作、文件、技能、插件与成果能力；增强案件上下文、法律标准、来源核验和律师交付。</p><h3>01 · 谁的工作台</h3><p>律所律师是主用户。以项目串起材料、任务、成果，首页直接进入工作，不以管理后台或产品架构作为第一屏。</p><h3>02 · 为什么先做这两条流程</h3><p>合同审查覆盖高频文件工作，展示本所标准和逐条修订；诉讼准备体现事实、证据、法源和诉请之间的关联。批量任务使用矩阵，避免长对话挤压审查空间。</p><h3>03 · 三层能力分工</h3><ul><li>原厂：Kimi Work 文档处理、技能、插件、本地工具执行；Business 成员与席位管理。</li><li>行业增强：案件元数据、律所规则、原文定位、人工处置、材料缺口与交付检查。</li><li>待联合确认：数据库商用授权、案件级权限、伦理墙、机构审计、身份集成、私有化及部署边界。</li></ul><h3>04 · 这次修正的调研结论</h3><ul><li>本地文件与执行不等于本地推理；不能承诺数据绝不出机。</li><li>类案检索指导意见不对所有律师设定普遍强制义务。</li><li>已废止法条不等于历史案件中绝对不能适用。</li><li>原厂已有法律插件和 Word 修订；差异化在法律标准与复核闭环。</li></ul><h3>05 · 当前演示的范围</h3><p>已实现导航、场景配置、条款接受/修改/拒绝/撤销、原文定位、矩阵核验/锁定/重试、来源选择、交付检查和 HTML / JSON / CSV 下载。全部客户、合同、金额为虚构样例。没有接入真实模型、文档解析或法律数据库；刷新页面会重置工作状态。</p><h3>核实来源</h3>${[['Kimi Work 官方介绍','https://www.kimi.com/help/kimi-work/overview'],['Kimi 本地 Agent 与云端模型说明','https://www.kimi.com/resources/local-ai-agent'],['Kimi 文档与修订能力','https://www.kimi.com/help/docs-and-sheets/docs-and-sheets-overview'],['Kimi 官方插件中心','https://www.kimi.com/help/kimi-work/plugin-center'],['Kimi Business 企业能力','https://www.kimi.com/help/kimi-business/kimi-business'],['Kimi 企业合作伙伴计划','https://www.kimi.com/news/kimi-enterprise-partner-program'],['智合 AI：公开首页','https://www.zhiexa.com/agents/home'],['Legora：表格审阅与核验','https://legora.com/product/tabular-review'],['LegalOn：合同审查标准','https://us-direct.legalontech.com/contract-playbooks'],['最高法：类案检索指导意见','https://www.court.gov.cn/fabu/xiangqing/243981.html'],['最高法：民法典时间效力规定','https://www.court.gov.cn/zixun/xiangqing/282051.html']].map(([t,u])=>`<a class="source-link" href="${u}" target="_blank" rel="noopener noreferrer">${t} ↗</a>`).join('')}<div class="divider"></div><a class="source-link" href="kimi-work-legal-research.html" target="_blank" rel="noopener">打开此前调研报告（保留原稿，部分结论已修正）↗</a><a class="source-link" href="kimi-work-legal-demo.html" target="_blank" rel="noopener">打开此前十屏概念稿 ↗</a><div class="divider"></div>${button('从合同审查开始演示','onboard','primary')}`,'',true)}
function dataBoundary(){modal('材料如何被使用',`${notice('当前网页只展示虚构样例，没有真实文件读取、模型调用或数据库访问。','neutral')}<h3>本演示</h3><p>添加文件仅在当前页面保留文件名，不读取文件内容，不上传。下载报告由浏览器本地生成。页面刷新后任务和审核状态重置。</p><h3>正式 Kimi Work 底座</h3><p>本地文件与工具可在设备上执行，但 Kimi 官方将其描述为由云端模型驱动的本地 AI 智能体。使用本地目录不能直接推导为内容绝不上传。</p><h3>发行版需要补齐的控制</h3><ul><li>按项目选择材料和具体访问范围。</li><li>明确模型请求与连接器的数据流向。</li><li>确认敏感信息策略、保留期限及处理方。</li><li>检索与输出权限和原始材料权限一致。</li></ul><a class="source-link" href="https://www.kimi.com/resources/local-ai-agent" target="_blank" rel="noopener noreferrer">查看 Kimi 官方说明 ↗</a>`,'',true)}
function standard(){modal('本所审查标准',`${pill('规则包示例 · v2.4','blue')}<h3 style="margin:15px 0">软件采购 · 采购方审查标准</h3><p class="muted" style="font-size:13px">维护者：衡序所科技业务组（演示）<br>适用：软件采购及定制开发；中国内地法域。<br>发布日期：2026-09-01</p><table class="mini-table" style="margin-top:20px"><thead><tr><th>规则</th><th>目标</th><th>处理要求</th></tr></thead><tbody>${issues.map(x=>`<tr><td>${x.rule}</td><td>${x.title}</td><td>${x.level==='重大'?'律师逐项复核':'可按客户立场调整'}</td></tr>`).join('')}</tbody></table><div style="margin-top:20px">${notice('规则代表示例律所的工作偏好，不把付款比例、整改期限等谈判条件包装成强制法律要求。','neutral')}</div>`,button('关闭','close')+button('应用到合同审查','apply-standard','primary'))}
function skillDetail(id){const [name,ver,desc]=skills.find(x=>x[3]===id);modal(name,`${pill('行业增强','blue')}<h3 style="margin:16px 0 9px">${ver}</h3><p class="muted">${desc}</p><div class="divider"></div><div class="stack"><div><b>输入要求</b><p class="small">原始材料、代理立场、法域、工作目的；材料不足时保留缺口。</p></div><div><b>执行标准</b><p class="small">固定版本的业务规则。关键判断保留给律师；来源与分析分开显示。</p></div><div><b>成果要求</b><p class="small">形成可复核工作底稿，不自动签署、发送客户或提交法院。</p></div></div><div class="divider"></div>${notice('当前为预置场景演示。正式技能包需加入规则维护、回归评估及发布权限。','neutral')}`,button('关闭','close')+button('使用这个技能','setup','primary',`data-id="${id}"`))}
function saveFile(filename,content,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已生成下载文件：'+filename);}
function exportHTML(title,body,filename){const css='body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:880px;margin:50px auto;padding:0 28px;color:#303947;font-size:14px;line-height:1.9}h1{font-size:28px}h2{font-size:20px;border-top:1px solid #ddd;padding-top:24px;margin-top:32px}h3{font-size:16px}.meta{color:#86909e;font-size:12px}.notice{padding:15px;background:#f5f7fa;border-left:3px solid #aabbd3;margin:22px 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:9px;text-align:left}a{color:#315da3}@media print{body{margin:10px;max-width:none}h2{break-after:avoid}}';saveFile(filename,`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHTML(title)}</title><style>${css}</style></head><body><h1>${escapeHTML(title)}</h1><p class="meta">Kimi Work 法律行业版 · 交互演示 · ${new Date().toLocaleString('zh-CN')}</p>${body}<div class="notice">全部客户与案件材料均为虚构示例。本文档展示工作流程与审查结构，不构成可直接使用的法律意见，也不证明真实案件已经复核。</div></body></html>`,'text/html;charset=utf-8')}
function exportReview(final=false){if(final&&(issues.some(x=>x.status==='pending')||!state.sourceReviewed||!state.customerConfirmed)){toast('请先完成条款处置、来源核对和材料缺口确认');return;}const body=`<p>项目：远山科技 · 软件采购（YS-2026-018）</p><p>标准：${escapeHTML(state.playbook)} · 复核人：林律师（演示）</p><div class="notice">状态：${final?'演示复核完成；合同定稿仍待客户补充指标':'内部草稿；部分事项可能未复核'}<br>未决事项：附件一性能指标、测试方法及整改期限仍待客户补充。</div>${issues.map((x,i)=>`<h2>${i+1}. ${x.title}</h2><p>来源：软件开发及服务合同_v1.docx · ${x.clause} · 第 ${x.page} 页</p><p>属性：${x.kind} · 标准：${x.rule}</p><h3>原文</h3><p>${escapeHTML(x.original)}</p><h3>建议</h3><p>${escapeHTML(x.edited||x.suggestion)}</p><p>理由：${x.why}</p><p>律师处置：${x.status==='accepted'?'接受'+(x.edited?'（已修改）':''):x.status==='rejected'?'拒绝':'待处理'}${x.reason?'；理由：'+escapeHTML(x.reason):''}</p>`).join('')}<h2>核对状态</h2><p>来源对应核对：${state.sourceReviewed?'已完成演示确认':'待核对'}<br>客户补充事项：${state.customerConfirmed?'已确认保留在报告中':'待确认处理方式'}</p><h2>假设与限制</h2><p>建议基于固定示例文件及采购方规则，未评估全部交易背景。付款比例、期限和权利安排均需律师结合客户目标判断。未接入模型或法律数据库，不能作为实时法律检索或正式合规审计记录。</p><h2>操作记录</h2><ul>${state.record.map(r=>`<li>${r.time} ${escapeHTML(r.text)}</li>`).join('')||'<li>尚无操作</li>'}</ul>`;record(final?'下载已复核的演示审查报告':'下载内部草稿');exportHTML('软件采购合同审查意见 · '+(final?'演示复核版':'内部草稿'),body,final?'软件采购合同_审查意见_演示复核版.html':'软件采购合同_审查意见_内部草稿.html');if(state.route==='delivery')render();}
function restoreInput(id,val){render();const el=$('#'+id);el?.focus();el?.setSelectionRange(val.length,val.length)}
document.addEventListener('input',e=>{if(e.target.id==='prompt'){state.prompt=e.target.value;if(e.target.value==='/')showSkillPicker();else if(e.target.value==='@')chooseProject();}if(e.target.id==='research-search'){state.search=e.target.value;restoreInput('research-search',state.search)}if(e.target.id==='skill-search'){state.skillSearch=e.target.value;restoreInput('skill-search',state.skillSearch)}if(e.target.id==='global-query'){const q=e.target.value;$('#global-results').innerHTML=searchResults(q)}});
document.addEventListener('change',e=>{if(e.target.id==='matrix-filter'){state.matrixFilter=e.target.value;render()}if(e.target.id==='research-filter'){state.evidenceFilter=e.target.value;render()}if(e.target.id==='customer-confirm'){state.customerConfirmed=e.target.checked;record(e.target.checked?'确认在报告中保留客户材料缺口':'撤销客户缺口处置确认');render()}});
function chooseProject(){modal('选择项目上下文',projects.map((p,i)=>`<button class="selection-row" data-action="select-project" data-id="${i}">${icon('folder')}<span class="grow"><h3>${escapeHTML(p.name)}</h3><p>${escapeHTML(p.id)} · ${escapeHTML(p.role)}</p></span>${state.project===i?pill('当前','blue'):icon('chevron')}</button>`).join('')+`<p class="disclosure">切换项目决定任务上下文。不同业务样例使用各自固定材料。</p>`)}
function showSkillPicker(){modal('选择法律技能',skills.map(([t,v,d,id,i])=>`<button class="selection-row" data-action="setup" data-id="${id}">${icon(i)}<span class="grow"><h3>${t}</h3><p>${v}</p></span>${icon('chevron')}</button>`).join(''))}
function searchResults(q=''){return [...projects.map((p,i)=>({name:p.name,sub:p.id,action:'open-project',id:i})),...skills.map(s=>({name:s[0],sub:s[1],action:'setup',id:s[3]}))].filter(x=>(x.name+x.sub).includes(q)).map(x=>`<button class="selection-row" data-action="${x.action}" data-id="${x.id}">${icon('search')}<span class="grow"><h3>${escapeHTML(x.name)}</h3><p>${escapeHTML(x.sub)}</p></span>${icon('chevron')}</button>`).join('')||'<div class="empty">没有匹配项目或技能</div>'}
document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){navigate(route.dataset.route);return;}if(e.target.dataset.dismiss==='true'){closeOverlay();return;}const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action,id=el.dataset.id;
 if(a==='close'){closeOverlay();return;}if(a==='menu'){$('.shell').classList.toggle('nav-open');return;}if(a==='new'){state.selectedSkill=null;state.prompt='';state.attachments=[];navigate('home');$('#prompt').focus();return;}if(['home','projects','project','skills','sources','delivery','research','contract','evidence','pleading','matrix','governance'].includes(a)){navigate(a);return;}
 if(a==='business'){state.business=id;render();return;}if(a==='choose-project'){chooseProject();return;}if(a==='select-project'){state.project=Number(id);if(state.prompt==='@')state.prompt='';closeOverlay();render();return;}if(a==='open-project'){state.project=Number(id);navigate('project');return;}if(a==='resume'){state.project=id==='contract'?0:id==='matrix'?2:1;navigate(id);return;}
 if(a==='attach'){const input=document.createElement('input');input.type='file';input.multiple=true;input.accept='.pdf,.docx,.doc,.txt,.md,.xlsx,.png,.jpg,.jpeg,.webp';input.onchange=()=>{state.attachments.push(...Array.from(input.files).map(f=>f.name));render();toast('仅添加文件名；演示不会读取或上传文件内容');};input.click();return;}if(a==='remove-attach'){state.attachments.splice(Number(id),1);render();return;}
 if(a==='send'){sendTask();return;}
 if(a==='setup'){setup(id);return;}if(a==='setup-back'){setup(state.target);return;}if(a==='plan'){plan();return;}if(a==='run'){run();return;}if(a==='onboard'){state.prompt='代表采购方审查软件开发及服务合同，按本所标准审阅付款、验收、知识产权与违约条款。';setup('contract');return;}if(a==='skill-picker'){showSkillPicker();return;}if(a==='skill-detail'){skillDetail(id);return;}if(a==='standard'){standard();return;}if(a==='apply-standard'){state.playbook='采购方审查标准 v2.4';state.role='采购方';closeOverlay();toast('已选择采购方审查标准 v2.4');return;}
 if(a==='select-issue'){state.selected=Number(id);render();$('#clause-'+id)?.scrollIntoView({behavior:'smooth',block:'nearest'});return;}if(a==='next-issue'){state.selected=(state.selected+1)%issues.length;render();return;}if(a==='doc-mode'){state.mode=id;render();return;}if(a==='source'){issueSource(Number(id));return;}if(a==='locate-clause'){state.selected=Number(id);navigate('contract');$('#clause-'+id)?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 if(a==='accept'){const x=issues[id];x.status='accepted';record(`接受 ${x.clause} 建议：${x.title}`);state.sourceReviewed=false;state.selected=Math.min(Number(id)+1,3);render();toast('建议已接受，可在原文修订模式中查看');return;}
 if(a==='edit-issue'){const x=issues[id];modal('修改后接受',`<p class="small" style="margin-bottom:13px">${x.clause} · ${x.title}</p><label for="issue-edit" class="small">修改建议文本</label><textarea class="input inline-edit" id="issue-edit" style="margin-top:8px">${escapeHTML(x.edited||x.suggestion)}</textarea>`,button('取消','close')+button('接受修改后的建议','save-edit','primary',`data-id="${id}"`));return;}
 if(a==='save-edit'){const val=$('#issue-edit').value.trim();if(!val){toast('建议文本不能为空');return;}issues[id].edited=val;issues[id].status='accepted';state.sourceReviewed=false;record(`修改并接受 ${issues[id].clause} 建议`);closeOverlay();render();toast('修改已接受，原文预览同步更新');return;}
 if(a==='reject'){modal('记录拒绝理由',`<p class="muted" style="font-size:13px;margin-bottom:17px">${issues[id].title}。保留律师判断，方便后续交付与复核。</p><div class="flex" style="flex-wrap:wrap;margin-bottom:15px">${['客户已确认此安排','本案不适用','已有其他条款保障'].map(t=>button(t,'reason-chip','sm',`data-value="${t}"`)).join('')}</div><label for="reject-reason" class="small">拒绝理由（必填）</label><textarea class="input" rows="3" id="reject-reason" placeholder="请简要记录判断依据" style="margin-top:8px"></textarea>`,button('取消','close')+button('确认拒绝','save-reject','primary',`data-id="${id}"`));return;}
 if(a==='reason-chip'){$('#reject-reason').value=el.dataset.value;return;}if(a==='save-reject'){const reason=$('#reject-reason').value.trim();if(!reason){toast('请填写拒绝理由');$('#reject-reason').focus();return;}issues[id].reason=reason;issues[id].status='rejected';state.sourceReviewed=false;record(`拒绝 ${issues[id].clause} 建议；理由：${reason}`);closeOverlay();render();return;}
 if(a==='undo'){issues[id].status='pending';issues[id].reason='';issues[id].edited='';state.sourceReviewed=false;record(`撤销 ${issues[id].clause} 处理，恢复待复核`);render();return;}
 if(a==='matrix-cell'){matrixSource(id);return;}if(a==='verify-cell'){if(state.matrixLocked.has(id)){toast('请先解除锁定，再撤销核验');return;}if(state.matrixVerified.has(id))state.matrixVerified.delete(id);else state.matrixVerified.add(id);record(`${state.matrixVerified.has(id)?'核验':'撤销核验'}矩阵单元格 ${id}`);render();matrixSource(id);return;}if(a==='lock-cell'){if(state.matrixLocked.has(id))state.matrixLocked.delete(id);else if(state.matrixVerified.has(id))state.matrixLocked.add(id);record(`${state.matrixLocked.has(id)?'锁定':'解除锁定'}矩阵单元格 ${id}`);render();matrixSource(id);return;}
 if(a==='retry'){state.matrixRetried=true;record('重新识别星河芯片合同（演示），待核验');render();toast('演示重试完成：请核对提取结果');return;}if(a==='rerun'){for(const k of state.matrixVerified)if(!state.matrixLocked.has(k))state.matrixVerified.delete(k);record('重跑未锁定单元格；保留所有已锁定结果');render();toast(`已恢复未锁定项为待核验，保留 ${state.matrixLocked.size} 个锁定单元格`);return;}
 if(a==='research-source'){researchSource(id);return;}if(a==='include-research'){state.researchIds.has(id)?state.researchIds.delete(id):state.researchIds.add(id);record(`${state.researchIds.has(id)?'纳入':'移除'}研究来源：${findings.find(x=>x.id===id).title}`);const wasOpen=!!$('#overlay').innerHTML;render();if(wasOpen)researchSource(id);return;}
 if(a==='evidence-source'){evidenceSource(Number(id));return;}if(a==='verify-evidence'){const i=Number(id);state.timelineReviewed.has(i)?state.timelineReviewed.delete(i):state.timelineReviewed.add(i);record('核对示例证据：'+evidence[i].file);render();evidenceSource(i);return;}

l-search" aria-label="搜索项目与技能">${icon('search')}</button><button class="btn quiet sm" data-action="design">${icon('info')}方案说明</button></div></header>${view()}<footer class="workspace-footer"><span><strong>中软国际</strong> × Kimi <span class="footer-sep">/</span> 法律行业发行版</span><span>示例数据 · 本地保存</span></footer></main></div>`;if(state.route==='home')$('#prompt').value=state.prompt;persistWorkspace();};
function navItem(id,i,t,active){return `<button class="nav-item ${active===id?'active':''}" data-route="${id}">${icon(i)}${t}${id==='connections'?'<span class="nav-dot"></span>':''}${id==='projects'?`<span class="count">${projects.length}</span>`:''}</button>`;}
function homeView(){const p=projects[state.project];const count=issues.filter(x=>x.status==='pending').length;return `<div class="home home-v2"><section class="welcome-block"><div class="greeting"><span class="greeting-line"></span>YOUR LEGAL WORKSPACE</div><h1>让专业判断，<span>从容落地。</span></h1><p class="welcome-sub">林律师，从一份合同、一组案卷，或一个法律问题开始。</p><div class="composer v2-composer"><div class="composer-context"><button data-action="choose-project">${icon('folder')}<span>${escapeHTML(p.name)}</span>${icon('down')}</button><span class="scope-label">${icon('lock')}项目上下文</span></div><div class="attached">${state.selectedSkill&&window.LegalSkills?.get(state.selectedSkill)?`<button class="pill blue" data-v2-action="clear-selected-skill">${icon('spark')}${escapeHTML(window.LegalSkills.get(state.selectedSkill).name)} ×</button>`:''}${state.attachments.map((f,i)=>`<button class="pill" data-action="remove-attach" data-id="${i}" title="移除 ${escapeHTML(f)}">${icon('file')}${escapeHTML(f)} ×</button>`).join('')}</div><textarea id="prompt" aria-label="描述法律工作任务" placeholder="把这项法律工作交给 Kimi…&#10;例如：审查这份软件采购合同，标出付款和验收风险，并给出修订建议。"></textarea><div class="composer-bottom"><button class="icon-btn" data-action="attach" aria-label="添加文件">${icon('plus')}</button><button class="chip-btn" data-action="skill-picker">${icon('spark')}选择技能${icon('down')}</button><button class="chip-btn" data-v2-action="task-tools">${icon('plug')}工具与资料</button><button class="chip-btn polish-btn" data-v2-action="polish">${icon('edit')}完善指令</button><button class="send" data-action="send" aria-label="开始任务">${icon('up')}</button></div></div><div class="composer-caption"><span><span class="status-dot"></span>按任务匹配技能 · 使用本所标准</span><span>⌘ / Ctrl + Enter 开始</span></div></section><section class="scenarios-section"><div class="section-header"><h2>开始一项法律工作</h2><div class="segments" role="group" aria-label="业务类型">${[['lit','诉讼仲裁'],['nonlit','非诉业务'],['counsel','企业法务']].map(([id,t])=>`<button class="${state.business===id?'on':''}" aria-pressed="${state.business===id}" data-action="business" data-id="${id}">${t}</button>`).join('')}</div></div><div class="workflow-grid compact-workflows">${workflows[state.business].map(([title,sub,id,i,out])=>`<button class="workflow-card" data-action="setup" data-id="${id}"><span class="workflow-icon">${icon(i)}</span><h3>${title}</h3><p>${sub}</p><div class="card-foot"><span>${out}</span>${icon('arrow','arrow')}</div></button>`).join('')}</div></section><div class="home-lower"><section class="continue-section"><div class="section-header"><h2>继续工作 <span class="section-count">03</span></h2><button class="link-btn" data-route="tasks">全部任务 ${icon('chevron')}</button></div><div class="recent">${[['软件采购合同审查','远山科技 · 采购方',count?`${count} 项待复核`:'条款已处理',count?'amber':'green','contract','file'],['采购合同尽调矩阵','启明投资 · 8 份合同',state.matrixRetried?'待核验':'1 份待处理','blue','matrix','table'],['事实与证据梳理','星澜实业 · 买卖合同纠纷','2 项待补齐','','evidence','folder']].map(([t,m,s,c,r,i])=>`<button class="recent-row" data-action="resume" data-id="${r}"><span class="flex"><span class="file-symbol">${icon(i)}</span><span><span class="recent-title">${t}</span><span class="recent-meta">${m}</span></span></span>${pill(s,c)}${icon('chevron')}</button>`).join('')}</div></section><aside class="attention-panel"><div class="section-header"><h2>待我关注</h2>${icon('bell')}</div><button class="attention-item" data-action="resume" data-id="contract"><span class="attention-dot amber"></span><span><b>${count?'完成合同风险复核':'检查合同交付清单'}</b><small>${count?`${count} 项建议需要你的专业判断`:'核对来源，并保留客户材料缺口'}</small></span>${icon('chevron')}</button><button class="attention-item" data-action="resume" data-id="evidence"><span class="attention-dot"></span><span><b>补齐证据材料</b><small>送货规格 · 催告送达证明</small></span>${icon('chevron')}</button><div class="attention-tip">关键结论由你把关，繁琐工作交给 Kimi。</div><button class="tour-link" data-v2-action="tour">第一次体验？走一遍完整流程 ${icon('arrow')}</button></aside></div></div>`;}
function connectionsView(){const filtered=v2.connectors.filter(c=>(v2.connectionFilter==='全部'||c.type===v2.connectionFilter)&&(c.name+c.desc+c.type).includes(v2.connectionSearch));return `<div class="content connections-v2">${pageHead('CONNECTED TO YOUR WORK','连接工具，让专业能力延伸','统一管理法律数据、项目资料和外部工具。技能按任务调用你启用的连接。',v2Button(icon('plus')+'添加自定义连接','custom-connector','','primary'))}<div class="connection-overview"><div><span class="connection-overview-icon">${icon('plug')}</span><div><b>你的工具工作空间</b><p>${v2.connectors.filter(connectionReady).length} 个模拟连接已启用 · ${v2.connectors.length} 个可配置连接</p></div></div><span class="pill blue">MCP · 演示模式</span></div><div class="connection-toolbar"><div class="filter-pills" role="group" aria-label="连接器分类">${['全部','法律数据','企业信息','项目资料','通用工具'].map(t=>`<button data-v2-action="connection-filter" data-id="${t}" class="${v2.connectionFilter===t?'active':''}" aria-pressed="${v2.connectionFilter===t}">${t}</button>`).join('')}</div><label class="search-box">${icon('search')}<input id="connection-search" aria-label="搜索连接器" placeholder="搜索连接器" value="${escapeHTML(v2.connectionSearch)}"></label></div><div class="connector-grid">${filtered.map(c=>`<article class="connector-card"><div class="flex between"><span class="connector-icon ${c.id}">${icon(c.icon)}</span>${pill(connectionReady(c)?'模拟已连接':c.tested?'已停用':'待配置',connectionReady(c)?'blue':'')}</div><h2>${escapeHTML(c.name)}</h2><p>${escapeHTML(c.desc)}</p><div class="connector-meta"><span>${escapeHTML(c.type)}</span><span>${c.allowed.length} 项工具</span></div><footer><span class="small">${scopeLabel(c.scope)}</span>${v2Button(connectionReady(c)?'管理连接':'配置连接','configure-connector',c.id,'sm')}</footer></article>`).join('')||'<div class="empty"><h3>没有匹配的连接器</h3><p>试试其他关键词或分类。</p></div>'}</div><div class="connection-disclosure">${icon('info')}当前测试、授权范围和调用记录均为本地模拟。不会请求服务器或保存密钥。</div><div class="connection-activity"><div class="section-header"><h2>最近连接活动</h2>${v2Button('查看配置 JSON','export-connectors','','quiet sm')}</div>${v2.connectors.some(c=>c.lastTest)?v2.connectors.filter(c=>c.lastTest).map(c=>`<div class="connection-event"><span class="status-dot"></span><b>${escapeHTML(c.name)}</b><span>模拟测试通过 · ${c.allowed.length} 项工具</span><time>${escapeHTML(c.lastTest)}</time></div>`).join(''):'<p class="small">配置并测试一个连接后，记录会出现在这里。</p>'}</div></div>`;}
function scopeLabel(scope){return ({current:'仅当前项目',public:'公开资料',team:'本所知识库'})[scope]||'仅当前项目';}
function configureConnector(id){const c=connectorById(id);if(!c)return;modal(escapeHTML(c.name)+' · 连接配置',`<div class="connector-config">${pill('本地模拟 · 不发起网络请求','blue')}<p class="config-intro">选择此连接允许访问的资料与工具，再运行模拟测试。</p><div class="form-grid"><div class="field full"><label for="connection-endpoint">服务地址</label><input class="input" id="connection-endpoint" value="${escapeHTML(c.endpoint)}" placeholder="https://service.example.test/mcp"><small>仅保存配置文本；请勿填入密钥或含凭据的地址。</small></div><div class="field"><label for="connection-transport">传输方式</label><select class="input" id="connection-transport"><option ${c.transport==='Streamable HTTP'?'selected':''}>Streamable HTTP</option><option ${c.transport==='SSE'?'selected':''}>SSE</option></select></div><div class="field"><label for="connection-scope">资料使用范围</label><select class="input" id="connection-scope">${[['current','仅当前项目'],['public','公开资料'],['team','本所知识库']].map(([v,t])=>`<option value="${v}" ${c.scope===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="config-heading"><h3>允许调用的工具</h3><span>最小必要范围</span></div><div class="tool-checks">${c.tools.map(([key,label])=>`<label><input type="checkbox" name="connection-tool" value="${escapeHTML(key)}" ${c.allowed.includes(key)?'checked':''}><span><b>${escapeHTML(label)}</b><code>${escapeHTML(key)}</code></span><span class="pill">${key.startsWith('export')?'生成':'只读'}</span></label>`).join('')}</div><div class="connection-test-result" id="connection-test-result" role="status">${c.tested?`${icon('check')}上次模拟测试通过。修改配置后需重新测试。`:`${icon('info')}尚未测试当前配置。`}</div><details class="advanced-config"><summary>认证与正式接入</summary><p>演示不收集 API Key 或 OAuth 凭据。正式客户端应通过受控凭据存储、服务端鉴权与实际 MCP 工具发现建立连接。</p></details></div>`,(c.enabled?v2Button('停用连接','disable-connector',id,'quiet'):'')+v2Button('测试配置','test-connector',id)+v2Button('保存并启用','save-connector',id,'primary'),true);}
function connectorForm(id){const c=connectorById(id),endpoint=$('#connection-endpoint').value.trim();let u;try{u=new URL(endpoint);if(!['https:','http:'].includes(u.protocol)||u.username||u.password||u.search||u.hash)throw Error();}catch(e){toast('请输入不含凭据、查询参数或片段的 HTTP(S) 服务地址');$('#connection-endpoint').focus();return null;}const allowed=[...document.querySelectorAll('[name="connection-tool"]:checked')].map(x=>x.value);if(!allowed.length){toast('请至少选择一项允许调用的工具');return null;}return {...c,endpoint,transport:$('#connection-transport').value,scope:$('#connection-scope').value,allowed};}
let testedDraft=null;
function testConnector(id){const c=connectorForm(id);if(!c)return;testedDraft={id,fingerprint:JSON.stringify([c.endpoint,c.transport,c.scope,c.allowed])};$('#connection-test-result').innerHTML=`${icon('check')}模拟校验通过 · 地址格式有效 · ${c.allowed.length} 项工具可用（未连接服务器）`;$('#connection-test-result').classList.add('passed');}
function sourcesView(){const docs=[['采购方审查标准 v2.4','审查标准','科技业务组','合同审查','standard'],['买卖合同文书模板 v1.3','文书模板','争议解决组','起诉状','pleading'],['投资方尽调标准 v1.8','审查标准','公司业务组','批量尽调','matrix'],['民商事证据梳理 v2.1','工作方法','争议解决组','证据整理','evidence'],['争议研究方法 v1.6','工作方法','知识管理组','法律研究','research']];const list=docs.filter(d=>d.join('').includes(v2.sourceSearch));return `<div class="content sources-v2">${pageHead('KNOWLEDGE & MATERIALS','让经验成为下一次工作的起点','项目文件、审查标准与文书模板，在同一个工作空间中连接。',button(icon('folder')+'查看项目材料','projects'))}<div class="tabs-line"><button class="${v2.sourceTab==='knowledge'?'on':''}" data-v2-action="source-tab" data-id="knowledge">本所知识库</button><button class="${v2.sourceTab==='project'?'on':''}" data-v2-action="source-tab" data-id="project">当前项目材料</button><button class="${v2.sourceTab==='public'?'on':''}" data-v2-action="source-tab" data-id="public">公开法律资料</button></div>${v2.sourceTab==='knowledge'?`<div class="knowledge-banner"><span class="knowledge-emblem">${icon('book')}</span><div><h2>衡序知识库</h2><p>标准有版本，经验可复用，来源可追溯。</p></div><span class="pill">5 份示例资料</span></div><div class="filters"><label class="search-box">${icon('search')}<input id="source-search" aria-label="搜索知识资料" value="${escapeHTML(v2.sourceSearch)}" placeholder="搜索标准、模板或业务领域"></label></div><div class="knowledge-list">${list.map(([t,type,owner,use,id])=>`<div class="knowledge-row"><span class="file-symbol">${icon(type==='文书模板'?'file':'book')}</span><div class="grow"><h3>${t}</h3><p>${owner} · 用于${use}</p></div>${pill(type)}${id==='standard'?button('查看规则','standard','sm'):v2Button('查看资料','knowledge-preview',id,'sm')}</div>`).join('')||'<div class="empty">未找到匹配资料</div>'}</div>`:v2.sourceTab==='project'?`<div class="panel"><div class="flex between"><h2>${escapeHTML(projects[state.project].name)}</h2>${button('切换项目','choose-project','sm')}</div><p class="muted">本次任务仅使用关联项目中的材料。添加文件只记录名称，不读取内容。</p><div class="divider"></div>${button('打开项目文件','project','primary')}</div>`:`<div class="knowledge-list">${findings.map(f=>`<div class="knowledge-row"><span class="file-symbol">${icon('scale')}</span><div class="grow"><h3>${f.title}</h3><p>${f.authority}</p></div>${button('查看来源','research-source','sm',`data-id="${f.id}"`)}</div>`).join('')}</div>`}<div class="help-foot">知识库展示固定示例。检索与索引服务可在 <button class="link-btn" data-route="connections">MCP 连接</button> 中配置演示。</div></div>`;}
function tasksView(){const rows=[{title:'软件采购合同审查',project:0,route:'contract',status:issues.some(x=>x.status==='pending')?'待复核':'已处理',desc:`已处理 ${issues.filter(x=>x.status!=='pending').length} / 4 项建议`,icon:'file'},{title:'采购合同尽调矩阵',project:2,route:'matrix',status:'待复核',desc:state.matrixRetried?'8 份已提取，待逐项核验':'7 份已提取 · 1 份待处理',icon:'table'},{title:'买卖合同纠纷事实梳理',project:1,route:'evidence',status:'待补充',desc:`${state.timelineReviewed.size} 项已核对 · 2 项缺口`,icon:'folder'},...v2.customDrafts.map(d=>({title:d.name+' · 工作底稿',project:d.project,route:'skill-workbench',draftId:d.draftId,status:'草稿',desc:'用户编辑 · '+d.version,icon:'edit'}))].filter(t=>v2.taskTab==='all'||(v2.taskTab==='review'?t.status==='待复核':t.status==='待补充'));return `<div class="content tasks-v2">${pageHead('YOUR WORK IN PROGRESS','每项工作，都有下一步','任务、处理进度与交付成果，持续保留在对应项目中。',button(icon('plus')+'新建任务','new','primary'))}<div class="tabs-line">${[['all','全部任务'],['review','待我复核'],['gap','待补充']].map(([id,t])=>`<button class="${v2.taskTab===id?'on':''}" data-v2-action="task-tab" data-id="${id}">${t}</button>`).join('')}</div><div class="task-list">${rows.map(t=>`<article class="task-item"><span class="task-symbol">${icon(t.icon)}</span><div class="grow"><h2>${escapeHTML(t.title)}</h2><p>${escapeHTML(projects[t.project].name)} · ${escapeHTML(t.desc)}</p></div>${pill(t.status,t.status==='待复核'?'amber':'blue')}${t.draftId?v2Button('继续编辑 '+icon('arrow'),'open-draft',t.draftId,'sm'):button('继续处理 '+icon('arrow'),'resume','sm',`data-id="${t.route}"`)}</article>`).join('')||'<div class="empty">当前没有这一状态的任务</div>'}</div><div class="section-header"><h2>最近运行</h2><span class="small">技能版本与工具快照</span></div>${v2.taskRuns.length?`<div class="run-history">${v2.taskRuns.slice(0,8).map(r=>`<div class="run-history-row"><span class="check-dot">✓</span><div class="grow"><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.version)} · ${escapeHTML(r.projectName)} · ${escapeHTML(r.time)}</p><p>${r.tools.map(t=>`${escapeHTML(t.name)}：${t.ready?'模拟可用':'使用   function validatePackage(source, knownTools=[], knownTemplates=[]) {
    const errors=[],warnings=[];

    if(typeof source==='string') {
      if(source.length>2*1024*1024)return {ok:false,errors:['文件超过 2 MB，请拆分技能包。'],warnings:[],skills:[]};
      try {value=JSON.parse(source);}catch(_){return {ok:false,errors:['JSON 格式不正确，请检查文件内容。'],warnings:[],skills:[]};}
    }
    if(!value||typeof value!=='object'||Array.isArray(value)||value.format!==PACKAGE_FORMAT||value.schemaVersion!==1)
      return {ok:false,errors:['仅支持 kimi-work-legal-skills 格式、schemaVersion 为 1 的技能包。'],warnings:[],skills:[]};
    if(!Array.isArray(value.skills)||!value.skills.length||value.skills.length>200)
      return {ok:false,errors:['技能包应包含 1–200 个技能。'],warnings:[],skills:[]};
    const ids=new Set(),skills=[];
    const textFields={id:100,name:40,version:20,description:120,category:30,icon:40,inputs:300,outputs:300,instructions:5000,templateId:100};
    const allowed=new Set([...Object.keys(textFields),'steps','checks','tools','enabled','archived']);
    value.skills.forEach((x,index)=>{
      const label=`第 ${index+1} 项`;
      if(!x||typeof x!=='object'||Array.isArray(x)){errors.push(label+'不是技能对象。');return;}
      const before=errors.length;
      Object.keys(x).forEach(k=>{if(!allowed.has(k))errors.push(label+'含不支持的字段：'+k);});
      for(const [key,max] of Object.entries(textFields)) {
        if(key==='templateId'&&x[key]===undefined)continue;
        if(typeof x[key]!=='string'||x[key].length>max||(!['description','templateId'].includes(key)&&!x[key].trim()))errors.push(label+'的 '+key+' 字段缺失、类型错误或超过 '+max+' 字。');
      }
      if(typeof x.id==='string'&&(!idPattern.test(x.id)||ids.has(x.id)))errors.push(label+'的 ID 不合法或在包内重复。');
      ids.add(x.id);
      if(!categories.includes(x.category))errors.push(label+'的业务分类不受支持。');
      for(const key of ['steps','checks','tools']) {
        if(!Array.isArray(x[key])||x[key].length>(key==='tools'?30:60)||x[key].some(t=>typeof t!=='string'||!t.trim()||t.length>(key==='tools'?100:1000)))errors.push(label+'的 '+key+' 必须是长度合理的非空文本数组。');
      }
      if(Array.isArray(x.tools)&&x.tools.some(t=>typeof t!=='string'||!idPattern.test(t)))errors.push(label+'包含不合法的工具 ID。');
      for(const key of ['enabled','archived'])if(x[key]!==undefined&&typeof x[key]!=='boolean')errors.push(label+'的 '+key+' 必须是布尔值。');
      if(errors.length!==before)return;
      const missing=[...new Set(x.tools)].filter(t=>!knownTools.includes(t));
      if(missing.length)warnings.push(x.name+'：当前缺少工具连接 '+missing.join('、')+'，导入后请配置或移除依赖。');
      if(x.templateId&&!knownTemplates.includes(x.templateId))warnings.push(x.name+'：原场景模板不存在，将作为独立技能保留。');
      if(x.archived)warnings.push(x.name+'：原包中已归档，将导入为停用的本所副本。');
      skills.push({...Object.fromEntries(Object.keys(textFields).map(k=>[k,(x[k]||'').trim()])),steps:x.steps.map(t=>t.trim()),checks:x.checks.map(t=>t.trim()),tools:[...new Set(x.tools)]});

  }

te'&&x){const duplicate=safeConfig({...copy(x),id:'custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name:x.name.slice(0,33)+' · 本所版',custom:true,featured:false,archived:false,enabled:true});catalog.push(duplicate);save();record('复制本所技能：'+duplicate.name);tab='mine';showArchived=false;query='';category='全部';closeOverlay();render();editor(duplicate.id);toast('已复制到本所技能，可继续调整');}else if(a==='use'){use(id);}else if(a==='manage'){navigate('skills');}else if(a==='prompt'&&x){state.selectedSkill=x.id;state.prompt=`请使用「${x.name}」协助我。\n${x.instructions}${x.steps.length?'\n执行步骤：\n'+x.steps.map((step,i)=>`${i+1}. ${step}`).join('\n'):''}${x.checks.length?'\n质量检查：\n'+x.checks.map(check=>'- '+check).join('\n'):''}\n预期成果：${x.outputs}\n待补充事项背景：`;navigate('home');$('#prompt')?.focus();}else if(a==='role'){const r=roles[Number(id)];if(r){state.selectedSkill=null;state.prompt=r.prompt;navigate('home');$('#prompt')?.focus();toast('已带入'+r.name+'的工作要求');}}});

    modal(escapeHTML(c.name)+' · 连接配置',`<div class="connector-config connection-plus">${pill('演示配置 · 无网络请求','blue')}<p class="config-intro">选择资料范围和工具。所有检查仅验证本地配置，stdio 命令不会执行。</p><div class="form-grid"><div class="field full"><label for="connection-name">连接名称</label><input id="connection-name" class="input" maxlength="100" value="${escapeHTML(c.name)}"></div><div class="field full"><label for="connection-description">用途说明</label><textarea id="connection-description" class="input" rows="2" maxlength="300">${escapeHTML(c.desc||'')}</textarea></div><div class="field"><label for="connection-transport">传输方式</label><select class="input" id="connection-transport">${transports.map(t=>`<option value="${t}" ${c.transport===t?'selected':''}>${t==='SSE'?'SSE（旧式 HTTP+SSE）':t}</option>`).join('')}</select></div><div class="field"><label for="connection-scope">资料范围</label><select class="input" id="connection-scope">${scopes.map(s=>`<option value="${s}" ${c.scope===s?'selected':''}>${scopeLabel(s)}</option>`).join('')}</select></div><div class="field full" id="connection-http-fields" ${c.transport==='stdio'?'hidden':''}><label for="connection-endpoint">服务地址</label><input class="input" id="connection-endpoint" value="${escapeHTML(c.endpoint||'')}" placeholder="https://service.example.test/mcp"><small>不包含凭据、查询参数或 URL 片段。</small></div><div class="field full" id="connection-stdio-fields" ${c.transport!=='stdio'?'hidden':''}><label for="connection-command">可执行文件</label><input class="input" id="connection-command" value="${escapeHTML(c.command||'')}" placeholder="例如：legal-mcp-server"><label for="connection-args">启动参数（JSON 数组）</label><textarea class="input" id="connection-args" rows="2">${escapeHTML(JSON.stringify(c.args||[]))}</textarea><small>仅保存启动配置；不会执行命令或读取环境变量。</small></div></div><details class="advanced-config" ${(c.auth?.kind&&c.auth.kind!=='none')?'open':''}><summary>鉴权方案</summary><div class="field"><label for="connection-auth">连接时的鉴权方式</label><select id="connection-auth" class="input">${[['none','无需鉴权'],['oauth','OAuth（仅记录方案）'],['env','环境变量（仅记录名称）']].map(([v,label])=>`<option value="${v}" ${(c.auth?.kind||'none')===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="field" id="connection-env-field" ${c.auth?.kind!=='env'?'hidden':''}><label for="connection-env-name">环境变量名称</label><input class="input" id="connection-env-name" value="${escapeHTML(c.auth?.envVar||'')}" placeholder="LEGAL_MCP_TOKEN" autocomplete="off"><small>不填写实际 token、密码或密钥。</small></div><p class="small" id="connection-oauth-note" ${c.auth?.kind!=='oauth'?'hidden':''}>正式连接由客户端发起 OAuth 授权。此处不会跳转、登录或获取令牌。</p></details><div class="config-heading"><h3>允许调用的工具</h3><span>仅使用明确勾选的工具</span></div><div class="tool-checks" id="connection-tool-checks">${toolChecks(c)}</div><details class="advanced-config"><summary>编辑工具清单与输入 Schema</summary><p class="small">工具清单每行为 ["工具名", "显示名称"]。更新清单后，新工具默认不勾选；需手动选择并重新检查。</p><label class="field" for="connection-tools-json">工具清单（JSON）<textarea id="connection-tools-json" class="input" rows="6" spellcheck="false">${escapeHTML(JSON.stringify(c.tools,null,2))}</textarea></label><label class="field" for="connection-schemas-json">输入 Schema（按工具名配置）<textarea id="connection-schemas-json" class="input" rows="9" spellcheck="false">${escapeHTML(JSON.stringify(c.inputSchemas||{},null,2))}</textarea></label><p class="small">每个 Schema 的 type 必须为 object，且对应已声明工具。没有独立 Schema 的工具使用示例请求结构；均未经真实工具发现。</p>${buttonPlus('更新工具选择清单','apply-tools',id,'sm')}</details><div class="connection-test-result" id="connection-test-result" role="status">${icon('info')}请检查当前配置后再保存并启用。</div><div class="connection-plus-secondary">${buttonPlus('下载此连接 JSON','export-one',id,'quiet sm')}</div></div>`,(c.enabled?v2Button('停用连接','disable-connector',id,'quiet'):'')+buttonPlus('保存未启用配置','save-draft',id)+buttonPlus('检查配置','test',id)+buttonPlus('保存并启用','save',id,'primary'),true);

  const originalConnectionsView=connectionsView;
  connectionsView=function(){return originalConnectionsView()+`<section class="connection-transfer"><div><h3>迁移连接配置</h3><p>导出不含凭据；导入后需检查工具白名单并重新测试。</p></div><div>${buttonPlus('导入 JSON','import','','sm')}${buttonPlus('下载全部配置','export-all','','sm')}</div></section>`;};
  function exportConfig(items) {return {format:'kimi-legal-connectors',version:1,demo:true,networkRequests:false,connections:items.map(snapshot)};}
  function parseImport(text) {
    if(text.length>500000)fail('配置文件过大，请限制在 500 KB 内。');
    let data;try{data=JSON.parse(text);}catch(_){fail('JSON 格式不正确。');}rejectSecrets(data);
    const items=Array.isArray(data)?data:data.connections;if(!Array.isArray(items)||!items.length||items.length>50)fail('请导入含 1–50 项 connections 的配置。');
    const seen=new Set();return items.map(raw=>{const c=validate(raw);if(seen.has(c.id))fail('导入文件包含重复连接 ID。');seen.add(c.id);const existing=connectorById(c.id);const known=new Set((existing?.tools||[]).map(t=>t[0]));const withheld=c.allowed.filter(key=>!known.has(key));return {...c,allowed:c.allowed.filter(key=>known.has(key)),enabled:false,tested:false,lastTest:'',importWithheld:withheld};});
  }
  function openImport(){modal('导入连接配置',`<div class="connection-plus"><p class="config-intro">导入后所有连接保持停用。新工具会保留在工具清单中，但需要你手动勾选才可启用。</p><label class="field">选择本地 JSON 文件<input type="file" id="connection-import-file" accept=".json,application/json"></label><label class="field">或粘贴 JSON<textarea class="input" id="connection-import-json" rows="12" spellcheck="false" placeholder='{"connections":[...]}'></textarea></label><div id="connection-import-status" role="status" class="small"></div></div>`,buttonPlus('校验并导入','apply-import','','primary'));}
  document.addEventListener('change',async e=>{
    if(['connection-transport','connection-auth'].includes(e.target.id))updateMode();
    if(e.target.id==='connection-import-file'){
      const f=e.target.files?.[0];if(!f)return;if(f.size>500000){toast('配置文件过大，请限制在 500 KB 内');return;}
      try{const contents=await f.text();if($('#connection-import-json'))$('#connection-import-json').value=contents;}catch(_){toast('无法读取配置文件，请重新选择或粘贴 JSON');}
    }
  });
  document.addEventListener('input',e=>{if(e.target.id?.startsWith('connection-')||e.target.name==='connection-tool'){checkedDraft=null;const result=$('#connection-test-result');if(result){result.classList.remove('passed');result.textContent='配置已修改，请重新检查后启用。';}}});
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-connection-plus-action]');if(!el)return;const a=el.dataset.connectionPlusAction,id=el.dataset.id;
    try{
      if(a==='apply-tools'){const c=formValue(id);$('#connection-tool-checks').innerHTML=toolChecks(c);checkedDraft=null;const r=$('#connection-test-result');r.classList.remove('passed');r.textContent='工具清单已更新。请勾选新工具，并重新检查后启用。';}
      if(a==='test'){const c=formValue(id);if(!c.allowed.length)fail('请至少选择一项工具后检查。');checkedDraft={id,fingerprint:fingerprint(c)};const r=$('#connection-test-result');r.innerHTML=`${icon('check')}本地格式检查通过 · ${c.allowed.length} 项工具 · 未验证服务器、命令或凭据`;r.classList.add('passed');}
      if(a==='save'||a==='save-draft'){
        const c=formValue(id);if(a==='save'&&(!c.allowed.length||checkedDraft?.id!==id||checkedDraft.fingerprint!==fingerprint(c)))fail('请先检查当前配置，修改后需要重新检查。');
        Object.assign(connectorById(id),c,{enabled:a==='save',tested:a==='save',lastTest:a==='save'?new Date().toLocaleString('zh-CN'):''});checkedDraft=null;persistWorkspace();record((a==='save'?'启用模拟连接：':'保存未启用连接：')+c.name);closeOverlay();render();toast(a==='save'?'模拟配置已启用，未建立真实连接':'配置已保存，连接保持停用');
      }
      if(a==='export-one'){const c=formValue(id);saveFile(c.name.replace(/[\\/:*?"<>|]/g,'_')+'_MCP.json',JSON.stringify(exportConfig([c]),null,2),'application/json');}
      if(a==='export-all')saveFile('法律工具连接_演示配置.json',JSON.stringify(exportConfig(v2.connectors),null,2),'application/json');
      if(a==='import')openImport();
      if(a==='apply-import'){
        const list=parseImport($('#connection-import-json').value);let withheld=0;
        for(const c of list){withheld+=c.importWithheld.length;const existing=connectorById(c.id);if(existing)Object.assign(existing,c);else v2.connectors.push(c);}
        checkedDraft=null;persistWorkspace();record(`导入 ${list.length} 项连接配置，均保持停用`);closeOverlay();render();toast(`已导入 ${list.length} 项，均未启用${withheld?`；${withheld} 项新工具待手动授权`:''}`);
      }
    }catch(error){toast(error.message||'配置处理失败，请检查输入');const status=$('#connection-import-status');if(status)status.textContent=error.message;}
  });
  // Read-only helpers support configuration validation and focused state tests.
  window.LegalConnectionsPlus={validate,parseImport,exportConfig};
})();

ote">材料不齐也可先建立底稿；无法核实的内容保留待补充。</p>${action('下载材料收集清单','collection',s.id,'sm')}</div>`:pane==='prompt'?`<div class="scenario-fields-head"><p>${d.manual?'手动编辑版 · 修改事项后，可点重新生成同步。':'自动生成版 · 事项信息会同步到完整指令。'}</p><div class="scene-prompt-actions">${action('复制','copy-prompt',s.id,'sm')}${action('下载','export-prompt',s.id,'sm')}${action('重新生成','regenerate',s.id,'sm')}</div></div><textarea id="scene-prompt" class="scenario-prompt" aria-label="完整预设提示词" spellcheck="false">${escapeHTML(d.prompt)}</textarea><p class="launch-note">手动编辑后会保留你的版本；修改事项信息不会自动覆盖全文。</p>`:`<div class="scene-method"><div class="scene-method-head"><div><span>专业 Skill</span><h3>${escapeHTML(cfg?.name||s.title)}</h3></div>${pill(cfg?.enabled?'已启用':'已停用',cfg?.enabled?'blue':'amber')}</div><h4>执行步骤</h4><ol>${(cfg?.steps||s.steps).map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ol><h4>质量检查</h4><ul>${(cfg?.checks||s.checks).map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul><h4>工具与资料</h4>${deps.map(c=>`<div class="scene-dependency"><span>${icon(c.icon)}${escapeHTML(c.name)}</span><small>${scopeLabel(c.scope)}</small>${action(connectionReady(c)?'模拟就绪 · 管理':'配置工具','scene-connection',c.id,'sm')}</div>`).join('')}<p class="launch-note">当前建立工作底稿，不调用外部服务。工具配置和技能版本会保存在任务快照中。</p>${action('配置此 Skill','skill',skillId(s),'sm')}</div>`}</div>`,action(launch.favorites.includes(s.id)?'★ 已收藏':'☆ 收藏预设','favorite',s.id,'quiet')+action('取消','cancel')+action(pane==='fields'?'下一步：准备材料':pane==='materials'?'查看预设指令':'带入工作台',pane==='fields'?'materials':pane==='materials'?'preview':'apply',s.id,'primary'),true);}

tor-heading"><span class="wpp-doc-tag">${doc.kind==='document'?'文书 / 提纲':doc.kind==='timeline'?'时间线 / 里程碑':'结构化工作表'}</span><h2>${esc(doc.title)}</h2><p>${esc(s.description)}</p></div>${editor(d,doc,w.activeOutput)}<footer class="wpp-editor-footer"><span>${w.mode==='demo'?'虚构样例 · 编辑后仍需律师核实':'模板结构 · 填写内容待律师复核'}</span><span>${w.activeOutput+1} / ${w.documents.length} 份成果</span></footer></main><aside class="wpp-context"><section class="wpp-side-card"><h3>事项信息 <span>本次输入</span></h3>${info.length?`<dl>${info.map(([label,value])=>`<div><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl>`:`<p class="wpp-context-prompt">${esc(d.facts||d.prompt||'本次尚未填写事项信息。')}</p>`}${d.sources?`<details><summary>来源记录</summary><p class="wpp-context-prompt">${esc(d.sources)}</p></details>`:''}${d.facts&&info.length?`<details><summary>事项背景原文</summary><p class="wpp-context-prompt">${esc(d.facts)}</p></details>`:''}</section><section class="wpp-side-card"><h3>执行步骤 <span>配置快照</span></h3><ol class="wpp-steps">${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section><section class="wpp-side-card"><h3>质量核对 <span id="wpp-check-count">${done} / ${checks.length}</span></h3><div class="wpp-checks">${checks.map((x,i)=>`<label><input type="checkbox" data-wpp-check="${i}" data-wpp-draft="${esc(d.draftId)}" ${w.checked[i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div><p class="wpp-footnote">勾选仅记录你的人工核对，不代表系统验证。</p></section>${materialsPanel(d)}${priorPanel(d)}${toolsPanel(d,s)}</aside></div></div>`;
  }
  customWorkpaperView=function(){const d=v2.customDraft,s=sceneFor(d);return s?view(d,s):originalWorkpaperView();};
  function documentMarkdown(doc){
    if(doc.kind==='document')return doc.sections.map(x=>`### ${x.label}\n\n${x.text||'［待填写］'}`).join('\n\n');
    const cell=x=>String(x||'［待填写］').replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>');
    return `| ${doc.columns.map(cell).join(' | ')} |\n| ${doc.columns.map(()=>'---').join(' | ')} |\n${doc.rows.map(row=>'| '+row.map(cell).join(' | ')+' |').join('\n')}\n\n口径与补充说明：${doc.notes||'［待填写］'}`;
  }
  function materialText(d){return (d.materials||[]).map(m=>'- '+m.name+' · '+m.role+' · '+(m.locator||'定位待补充')+'\n  人工摘录：'+(m.excerpt||'未填写')+'\n  文件正文未随任务保存，未做 OCR 或自动分析。').join('\n\n')||((d.attachments||[]).join('、')||'未附材料');}
  function materialsPanel(d){return `<section class="wpp-side-card"><h3>材料与口径 <span>创建时快照</span></h3><p class="wpp-context-prompt">${esc(materialText(d))}</p>${Object.entries(d.scenarioContext||{}).filter(([,v])=>v).map(([key,v])=>`<p class="wpp-footnote">${esc(({jurisdiction:'法域与地域',position:'委托立场',asof:'事实与核验时间',audience:'交付要求'})[key]||key)}：${esc(v)}</p>`).join('')}</section>`;}
  function markdown(d,s,w){
    const values=s.fields.map(f=>`- ${f.label}：${d.scenarioValues?.[f.key]||'待填写'}`).join('\n');
    const checks=Array.isArray(d.checks)&&d.checks.length?d.checks:s.checks;
    return `# ${d.name||s.title}\n\n项目：${d.projectName||'当前事项'}\n\n技能版本：${d.version||'v1.0'}\n\n> ${w.mode==='demo'?'固定虚构演示底稿，与输入事项无关。':'场景工作结构，由用户编辑填写。'}未运行模型、解析文件或查询数据库；仅供内部工作及律师复核。\n\n## 事项信息（用户输入）\n\n${values}\n\n## 材料与人工摘录（创建时快照）\n\n${materialText(d)}\n\n## 事项口径\n\n${Object.values(d.scenarioContext||{}).filter(Boolean).join(" · ")||"待确认"}\n\n${d.facts?'事项背景：\n'+d.facts+'\n\n':''}${priorMarkdown(d)}${w.documents.map(doc=>'## '+doc.title+'\n\n'+documentMarkdown(doc)).join('\n\n')}\n\n## 人工质量核对\n\n${checks.map((x,i)=>`- [${w.checked[i]?'x':' '}] ${x}`).join('\n')}\n\n## 执行步骤（配置快照）\n\n${(d.steps?.length?d.steps:s.steps).map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n## 工具快照（未真实执行）\n\n${(d.tools||s.tools).map(t=>typeof t==='string'?'- '+(toolNames[t]||t):'- '+(t.name||t.id)+'：'+(t.ready?'模拟可用':'未连接 / 待配置')).join('\n')}\n`;
  }
  function htmlExport(d,s,w){
    const info=s.fields.map(f=>`<dt>${esc(f.label)}</dt><dd>${esc(d.scenarioValues?.[f.key]||'待填写')}</dd>`).join('');
    const documents=w.documents.map(doc=>`<section><h2>${esc(doc.title)}</h2>${doc.kind==='document'?doc.sections.map(x=>`<h3>${esc(x.label)}</h3><p class="pre">${esc(x.text||'［待填写］')}</p>`).join(''):`<table><thead><tr>${doc.columns.map(c=>'<th>'+esc(c)+'</th>').join('')}</tr></thead><tbody>${doc.rows.map(row=>'<tr>'+row.map(c=>'<td class="pre">'+esc(c||'［待填写］')+'</td>').join('')+'</tr>').join('')}</tbody></table><p class="pre">口径与补充说明：${esc(doc.notes||'［待填写］')}</p>`}</section>`).join('');
    const checks=(d.checks?.length?d.checks:s.checks).map((x,i)=>`<li>${w.checked[i]?'☑':'☐'} ${esc(x)}</li>`).join('');
    return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(d.name||s.title)} · 内部工作底稿</title><style>body{max-width:1060px;margin:48px auto;padding:0 32px;color:#24322e;font:15px/1.8 system-ui,sans-serif}h1{font-size:30px}h2{font-size:22px;border-bottom:1px solid #d9e3dd;padding-bottom:10px}h3{font-size:16px}section{margin:36px 0}.notice{background:#f3f6f2;border-left:3px solid #6d856d;padding:14px 20px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}td,th{border:1px solid #dce3dd;text-align:left;vertical-align:top;padding:12px;overflow-wrap:anywhere}th{background:#f3f6f2}.pre{white-space:pre-wrap;overflow-wrap:anywhere}dt{font-weight:650;margin-top:12px}dd{margin:0;white-space:pre-wrap}li{margin:7px 0}@media print{body{margin:0;max-width:none}section{break-inside:auto}h2,h3{break-after:avoid}tr{break-inside:avoid}}</style></head><body><p>Kimi Work · 法律行业版 / ${esc(s.area)}</p><h1>${esc(d.name||s.title)}</h1><p>${esc(d.projectName||'当前事项')} · ${esc(d.version||'v1.0')}</p><div class="notice">${w.mode==='demo'?'固定虚构演示底稿，与本次输入事项无关。':'场景工作结构，由用户编辑填写。'}未运行模型、解析文件或查询数据库；仅供内部工作及律师复核。</div><section><h2>事项信息（用户输入）</h2><dl>${info}</dl>${d.facts?'<p class="pre">'+esc(d.facts)+'</p>':''}</section><section><h2>材料与人工摘录（创建时快照）</h2><p class="pre">${esc(materialText(d))}</p><p>${esc(Object.values(d.scenarioContext||{}).filter(Boolean).join(" · ")||"事项口径待确认")}</p></section>${priorHTML(d)}${documents}<section><h2>人工质量核对</h2><ul>${checks}</ul><p>勾选仅记录人工核对，不代表系统验证。</p></section><section><h2>执行步骤与工具快照</h2><ol>${(d.steps?.length?d.steps:s.steps).map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><ul>${(d.tools||s.tools).map(t=>'<li>'+esc(typeof t==='string'?(toolNames[t]||t):(t.name||t.id)+'：'+(t.ready?'模拟可用':'未连接 / 待配置'))+'</li>').join('')}</ul><p>本工作区未真实执行工具。</p></section></body></html>`;
  }
  function loadDemo(d,s,w){
    if(w.demoBackup||!['criminal-interview','civil-evidence'].includes(s.id))return;
    w.demoBackup={documents:clone(w.documents),checked:clone(w.checked),activeOutput:w.activeOutput,mode:w.mode};
    w.documents=s.outputs.map((title,i)=>schema(s,title,i));
    w.checked={};w.activeOutput=0;w.mode='demo';
    if(s.id==='criminal-interview'){
      const texts=[
        ['【虚构演示】涉嫌职务侵占的财务主管林某，拟进行首次会见。拘留日期、会见手续及具体程序状态均待核实。\n先询问是否有健康、用药或沟通上的即时需要；不要把家属说法作为当事人事实。','1. 请从你任职、负责的工作和审批权限讲起。\n2. 涉及的款项是什么业务？分别由谁申请、批准和支付？\n3. 哪些内容是你亲自经历，哪些是听他人说明？\n4. 你提到的垫付款对应哪些报销记录？\n5. 到案经过如何，相关时间或通知在哪里可以核实？','需要了解：公司审批制度、报销明细、银行流水、相关沟通的完整记录。\n开放询问讯问及权利保障情况，对回答如实记录。未取得材料前不评价案件证据是否充分。','复述关键回答，请当事人纠正记录。\n整理可核实线索，提交律师决定后续调查顺序。\n不承诺释放、无罪或处理期限。'],
        ['【虚构演示记录框架】\n日期、地点、会见人员：待填写\n涉嫌罪名及程序状态：待核实\n本样例没有真实会见发生。','以下只是记录方式演示，并非真实供述：\n问：款项与报销有何关系？\n答：当事人可能提出垫付款解释——此处须填写实际原话，不得沿用样例。\n信息属性：当事人陈述 / 亲历或转述待确认。','线索一：公司报销审批原件及附件。\n线索二：对应银行流水与收款主体。\n缺口：是否存在重复报销、授权范围及款项实际用途均未知。','律师复核：不得根据垫付款解释直接得出无罪判断。\n下一步：核查客观材料，保留支持及不支持该解释的证据。'],
      ];
      texts.forEach((group,i)=>group.forEach((text,j)=>{w.documents[i].sections[j].text=text;}));
      w.documents[2].rows=[['款项对应的业务及用途','虚构演示线索，事实未核实','核查报销单、审批附件、银行流水','案件律师 / 待确认'],['授权权限与制度版本','尚未取得公司文件','调取适用期间制度及任职授权','案件律师 / 待补材料'],['到案及程序状态','家属说明不能替代正式文书','核对通知文书及本人陈述','案件律师 / 待核']];
      w.documents[2].notes='固定虚构案例，仅演示记录结构。没有执行会见、阅卷或外部查询。';
    }else{
      w.documents[0].rows=[['演示证据01：购销合同','虚构样例；无实际文件 / 原件待核','拟证明交易关系及付款约定','签署主体、正文附件和具体付款条件待核验'],['演示证据02：送货单','虚构样例；12份中8份据称签收','拟证明货物交付及接收主体','未签收部分不能直接认定已交付；需其他证据补强'],['演示证据03：对账沟通','虚构样例；聊天完整性待核','拟证明往来金额确认过程','须确认账号主体、上下文、原始载体及是否附条件']];
      w.documents[1].rows=[['演示材料：质量异议邮件','发件主体、完整内容及形成时间待核','是否指向本案交付批次及约定质量标准待核','核对邮件上下文、异议时间及对应批次'],['演示材料：第三方检测报告','报告原件、检测主体与取样过程待核','检测样品与交付货物是否同一待核','核对样品来源、检测依据及范围'],['演示材料：退货单','签收人权限和原始凭证待核','涉及数量是否可与订单和送货单对应待核','核查退货接收、库存及价款冲减记录']];
      w.documents[2].rows=[['未签收部分是否实际交付','虚构送货记录，尚无正文','缺接收凭证与运输交接信息','核查物流签收和往来确认 / 责任人待定'],['对账金额是否包含争议退货','虚构聊天与退货线索','需核查对账截止、退货批次和抵扣','制作逐笔对照并复核原始材料 / 待办'],['检测结果是否关联本批货物','虚构检测报告线索','样品来源及批次对应不明','核查取样与封样记录 / 待补材料']];
      w.documents.forEach(doc=>doc.notes='以上为固定虚构演示数据，不来自当前事项。未读取文件；所列证明目的及疑问不能视为证据真实性、效力或案件结果的判断。');
    }
    save(d);render();toast('已载入固定虚构演示底稿，原稿可一键恢复');
  }
  document.addEventListener('input',e=>{
    const el=e.target;if(!el.dataset?.wppDraft||el.dataset.wppCheck!==undefined)return;
    const context=active();if(!context||context.d.draftId!==el.dataset.wppDraft)return;
    const {d,w}=context,doc=w.documents[Number(el.dataset.wppOutput)];if(!doc)return;
    if(el.dataset.wppSection!==undefined&&doc.kind==='document'&&doc.sections[Number(el.dataset.wppSection)])doc.sections[Number(el.dataset.wppSection)].text=el.value;
    else if(el.dataset.wppNotes!==undefined)doc.notes=el.value;
    else if(el.dataset.wppRow!==undefined&&doc.rows?.[Number(el.dataset.wppRow)]&&Number(el.dataset.wppCol)<doc.columns.length)doc.rows[Number(el.dataset.wppRow)][Number(el.dataset.wppCol)]=el.value;
    else return;
    save(d);
    const tab=document.getElementById('wpp-tab-'+el.dataset.wppOutput)?.querySelector('small');if(tab)tab.textContent=written(doc)?'已有编辑内容':'待填写结构';
  });
  document.addEventListener('change',e=>{
    const el=e.target;if(el.dataset?.wppCheck===undefined)return;
    const context=active();if(!context||context.d.draftId!==el.dataset.wppDraft)return;
    const {d,s,w}=context,checks=d.checks?.length?d.checks:s.checks,index=Number(el.dataset.wppCheck);
    if(!Number.isInteger(index)||index<0||index>=checks.length)return;
    w.checked[index]=!!el.checked;save(d);
    const count=document.getElementById('wpp-check-count');if(count)count.textContent=checks.filter((_,i)=>w.checked[i]).length+' / '+checks.length;
  });
  document.addEventListener('keydown',e=>{
    const el=e.target.closest('[data-workpaper-plus-action="select-output"]');
    if(!el||!['ArrowDown','ArrowUp','Home','End'].includes(e.key))return;
    const context=active();if(!context||context.d.draftId!==el.dataset.draftId)return;
    e.preventDefault();const {d,w}=context,n=w.documents.length;
    w.activeOutput=e.key==='Home'?0:e.key==='End'?n-1:(w.activeOutput+(e.key==='ArrowDown'?1:-1)+n)%n;
    save(d);render();document.getElementById('wpp-tab-'+w.activeOutput)?.focus();
  });
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-workpaper-plus-action]');if(!el)return;
    const context=active();if(!context||context.d.draftId!==el.dataset.draftId)return;
    const {d,s,w}=context,a=el.dataset.workpaperPlusAction,index=Number(el.dataset.output),doc=w.documents[index];
    if(a==='select-output'&&doc){w.activeOutput=index;save(d);render();document.getElementById('wpp-tab-'+index)?.focus();}
    else if(a==='add-row'&&doc?.rows){doc.rows.push(doc.columns.map(()=>''));save(d);render();}
    else if(a==='remove-row'&&doc?.rows){const row=Number(el.dataset.row);if(Number.isInteger(row)&&row>=0&&row<doc.rows.length){doc.rows.splice(row,1);if(!doc.rows.length)doc.rows.push(doc.columns.map(()=>''));save(d);render();}}
    else if(a==='instructions'){modal('本次执行规则',`<div class="wpp-rules"><p>技能版本：${esc(d.version||'v1.0')} · 创建时配置快照</p><pre>${esc(d.instructions||s.instructions)}</pre><h3>共同工作要求</h3><p>${esc(window.LEGAL_PROMPT_RULES||'')}</p></div>`,button('关闭','close'));}
    else if(a==='load-demo')loadDemo(d,s,w);
    else if(a==='restore-demo'&&w.demoBackup){const backup=w.demoBackup;w.documents=clone(backup.documents);w.checked=clone(backup.checked);w.activeOutput=backup.activeOutput;w.mode=backup.mode;w.demoBackup=null;save(d);render();toast('已恢复载入演示前的原稿');}
    else if(a==='export-md'||a==='export-html'){save(d);const name=(d.name||s.title).replace(/[\\/:*?"<>|]/g,'_')+'_工作底稿';saveFile(name+(a==='export-md'?'.md':'.html'),a==='export-md'?markdown(d,s,w):htmlExport(d,s,w),a==='export-md'?'text/markdown;charset=utf-8':'text/html;charset=utf-8');}
  });
})();

<script>
// legal-materials.js
