# 引擎漂移报警（复核 B13-C02；第 14 批第二轮复核 R2B-29 拆成独立工作流）：embed-drift 要 fork 源码在场——
# 按补丁台账（platform/third_party/PATCHES.md）从上游 2.2.0 tag + 中软补丁重建后专跑；KWL_REQUIRE_FORK=1 时 fork 不在即失败（不静默跳过）。
# 所有分支的推送与合并请求都跑（锁定值漂移要在合并前发现，而不是合进 main 之后）。
name: engine-drift

on:
  workflow_dispatch:
  pull_request:
    paths: ["platform/packages/kap-host/**", "platform/third_party/**", ".github/workflows/engine-drift.yml"]
  push:
    paths: ["platform/packages/kap-host/**", "platform/third_party/**", ".github/workflows/engine-drift.yml"]

permissions:
  contents: read

concurrency:
  group: engine-drift-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform
    shell: bash

jobs:
  engine-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: 重建 fork（上游 tag + third_party/patches）
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/MoonshotAI/kimi-code.git third_party/kimi-code
          git -C third_party/kimi-code checkout --detach 472192c34c1efad89a369870eff0da0b708ce9bb
          git -C third_party/kimi-code apply --check ../patches/kimi-code-2.2.0-zhongruan.patch
          git -C third_party/kimi-code apply ../patches/kimi-code-2.2.0-zhongruan.patch
      - run: node --test packages/kap-host/test/embed-drift.test.ts packages/kap-host/test/static-surface.test.ts
        env:
          KWL_REQUIRE_FORK: "1"
